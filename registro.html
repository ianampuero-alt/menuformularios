<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Nuevo Cliente (BP) - SAP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        body { background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin-top: 30px; }
        .card-panel { padding: 30px; border-radius: 8px; }
        h4, h5 { color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 8px; margin-top: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .contact-section { background: #fafafa; padding: 20px; border-left: 4px solid #0056b3; margin-bottom: 20px; border-radius: 0 4px 4px 0; }
        .btn-submit { width: 100%; margin-top: 20px; background-color: #0056b3 !important; }
        .hide { display: none !important; }
        .input-field .select-wrapper { width: 100%; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card-panel grey lighten-5 z-depth-1">
        <h4 class="center-align" style="border: none; margin-top: 0; color: #0056b3;">Solicitud de Creación de Cliente</h4>
        
        <form id="registro-form">
            
            <h5>Datos de la Empresa</h5>
            <div class="grid">
                <div class="input-field"><input id="CardName" type="text" name="CardName" required><label for="CardName">Nombre Razón Social</label></div>
                <div class="input-field">
                    <input id="FederalTaxID" type="text" name="FederalTaxID" required placeholder="12345678-9">
                    <label for="FederalTaxID">RUT de la Empresa</label>
                    <span id="rut-error" class="helper-text red-text"></span>
                </div>
                
                <div class="input-field"><input id="Address" type="text" name="Address" required><label for="Address">Dirección</label></div>
                <div class="input-field"><input id="City" type="text" name="City" required><label for="City">Ciudad</label></div>
                
                <div class="input-field">
                    <select id="County" name="County" required>
                        <option value="" disabled selected>Seleccione primero una región</option>
                    </select>
                    <label for="County">Comuna / Condado</label>
                </div>
                <div class="input-field">
                    <select id="BillToState" name="BillToState" required>
                        <option value="" disabled selected>Seleccione una Región</option>
                        <option value="Región Metropolitana de Santiago">Región Metropolitana de Santiago</option>
                        <option value="Región de Arica y Parinacota">Región de Arica y Parinacota</option>
                        <option value="Región de Tarapacá">Región de Tarapacá</option>
                        <option value="Región de Antofagasta">Región de Antofagasta</option>
                        <option value="Región de Atacama">Región de Atacama</option>
                        <option value="Región de Coquimbo">Región de Coquimbo</option>
                        <option value="Región de Valparaíso">Región de Valparaíso</option>
                        <option value="Región del Libertador Gral. Bernardo O'Higgins">Región del Libertador Gral. Bernardo O'Higgins</option>
                        <option value="Región del Maule">Región del Maule</option>
                        <option value="Región del Biobío">Región del Biobío</option>
                        <option value="Región de La Araucanía">Región de La Araucanía</option>
                        <option value="Región de Los Ríos">Región de Los Ríos</option>
                        <option value="Región de Los Lagos">Región de Los Lagos</option>
                        <option value="Región de Aysén del Gral. Carlos Ibáñez del Campo">Región de Aysén del Gral. Carlos Ibáñez del Campo</option>
                        <option value="Región de Magallanes y de la Antártica Chilena">Región de Magallanes y de la Antártica Chilena</option>
                        <option value="Región de Ñuble">Región de Ñuble</option>
                    </select>
                    <label for="BillToState">Región</label>
                </div>

                <div class="input-field"><input id="U_NXGiro" type="text" name="U_NXGiro" required><label for="U_NXGiro">Giro Comercial</label></div>
                <div class="input-field"><input id="EmailAddress" type="email" name="EmailAddress" required><label for="EmailAddress">Correo Electrónico General</label></div>
            </div>

            <h5>Contacto 1: Firmante o Representante Legal (RRLL)</h5>
            <div class="contact-section grid">
                <div class="input-field"><input id="C1_FirstName" type="text" name="C1_FirstName" required><label for="C1_FirstName">Nombres</label></div>
                <div class="input-field"><input id="C1_LastName" type="text" name="C1_LastName" required><label for="C1_LastName">Apellidos</label></div>
                
                <div class="input-field">
                    <input id="C1_Rut" type="text" name="C1_Rut" required placeholder="12345678-9">
                    <label for="C1_Rut">RUT del Firmante</label>
                    <span id="c1-rut-error" class="helper-text red-text"></span>
                </div>
                
                <div class="input-field"><input id="C1_Email" type="email" name="C1_Email" required><label for="C1_Email">Correo Electrónico</label></div>
                <div class="input-field"><input id="C1_Pager" type="text" name="C1_Pager" required><label for="C1_Pager">Teléfono</label></div>
            </div>

            <h5>Contacto 2: Pago a Proveedores</h5>
            <div class="contact-section grid">
                <div class="input-field"><input id="C2_FirstName" type="text" name="C2_FirstName" required><label for="C2_FirstName">Nombres</label></div>
                <div class="input-field"><input id="C2_LastName" type="text" name="C2_LastName" required><label for="C2_LastName">Apellidos</label></div>
                <div class="input-field"><input id="C2_Email" type="email" name="C2_Email" required><label for="C2_Email">Correo Electrónico</label></div>
                <div class="input-field"><input id="C2_Pager" type="text" name="C2_Pager" required><label for="C2_Pager">Teléfono</label></div>
            </div>

            <button type="submit" id="btn-enviar" class="btn waves-effect waves-light btn-submit">Enviar Solicitud de Creación</button>
        </form>

        <div id="success-message" class="center-align hide">
            <h5 style="color: #4CAF50; border: none;">¡Solicitud Enviada con Éxito!</h5>
            <p>Su requerimiento pasará a un proceso de validación interna. Nos pondremos en contacto pronto.</p>
            <p style="color: #757575; font-size: 0.9rem; margin-top: 15px;">Redirigiendo a alorental.cl...</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
    const ChileData = {
        "Región Metropolitana de Santiago": ["Cerrillos", "Cerro Navia", "Conchalí", "El Bosque", "Estación Central", "Huechuraba", "Independencia", "La Cisterna", "La Florida", "La Granja", "La Pintana", "La Reina", "Las Condes", "Lo Barnechea", "Lo Espejo", "Lo Prado", "Macul", "Maipú", "Ñuñoa", "Pedro Aguirre Cerda", "Peñalolén", "Providencia", "Pudahuel", "Puente Alto", "Quilicura", "Quinta Normal", "Recoleta", "Renca", "San Bernardo", "San Joaquín", "San Miguel", "San Ramón", "Santiago", "Vitacura", "Colina", "Lampa", "Tiltil", "Pirque", "San José de Maipo", "Buin", "Calera de Tango", "Paine", "Melipilla", "Alhué", "Curacaví", "María Pinto", "San Pedro", "Talagante", "El Monte", "Isla de Maipo", "Padre Hurtado", "Peñaflor"],
        "Región de Arica y Parinacota": ["Arica", "Camarones", "Putre", "General Lagos"],
        "Región de Tarapacá": ["Iquique", "Alto Hospicio", "Pozo Almonte", "Camiña", "Colchane", "Huara", "Pica"],
        "Región de Antofagasta": ["Antofagasta", "Mejillones", "Sierra Gorda", "Taltal", "Calama", "Ollagüe", "San Pedro de Atacama", "Tocopilla", "María Elena"],
        "Región de Atacama": ["Copiapó", "Caldera", "Tierra Amarilla", "Vallenar", "Alto del Carmen", "Freirina", "Huasco", "Chañaral", "Diego de Almagro"],
        "Región de Coquimbo": ["La Serena", "Coquimbo", "Andacollo", "La Higuera", "Paiguano", "Vicuña", "Illapel", "Canela", "Los Vilos", "Salamanca", "Ovalle", "Combarbalá", "Monte Patria", "Punitaqui", "Río Hurtado"],
        "Región de Valparaíso": ["Valparaíso", "Viña del Mar", "Casablanca", "Concón", "Puchuncaví", "Quintero", "San Antonio", "Algarrobo", "Cartagena", "El Quisco", "El Tabo", "Santo Domingo", "Quillota", "La Calera", "Hijuelas", "La Cruz", "Nogales", "San Felipe", "Catemu", "Llaillay", "Panquehue", "Putaendo", "Santa María", "Los Andes", "Calle Larga", "Rinconada", "San Esteban", "Quilpué", "Villa Alemana", "Limache", "Olmué", "La Ligua", "Cabildo", "Papudo", "Petorca", "Zapallar"],
        "Región del Libertador Gral. Bernardo O'Higgins": ["Rancagua", "Machalí", "Graneros", "Mostazal", "Doñihue", "Coltauco", "Coinco", "Olivar", "Placilla", "Rengo", "Requínoa", "San Vicente", "Pichidegua", "Peumo", "Las Cabras", "San Fernando", "Chimbarongo", "Nancagua", "Peralillo", "Santa Cruz", "Pumanque", "Palmilla", "Litueche", "Navidad", "Pichilemu", "Marchigüe", "La Estrella", "Paredones"],
        "Región del Maule": ["Talca", "Constitución", "Curepto", "Empedrado", "Maule", "Pelarco", "Pencahue", "Río Claro", "San Clemente", "San Rafael", "Curicó", "Hualañé", "Licantén", "Molina", "Rauco", "Romeral", "Sagrada Familia", "Teno", "Vichuquén", "Linares", "Colbún", "Longaví", "Parral", "Retiro", "San Javier", "Villa Alegre", "Yerbas Buenas", "Cauquenes", "Chanco", "Pelluhue"],
        "Región de Ñuble": ["Chillán", "Chillán Viejo", "Bulnes", "Cobquecura", "Coelemu", "Coihueco", "El Carmen", "Ninhue", "Ñiquén", "Pemuco", "Pinto", "Portezuelo", "Quillón", "Quirihue", "Ránquil", "San Carlos", "San Fabián", "San Ignacio", "San Nicolás", "Treguaco", "Yungay"],
        "Región del Biobío": ["Concepción", "Chiguayante", "Coronel", "Florida", "Hualpén", "Hualqui", "Lota", "Penco", "San Pedro de la Paz", "Santa Juana", "Talcahuano", "Tomé", "Los Ángeles", "Antuco", "Cabrero", "Laja", "Mulchén", "Nacimiento", "Negrete", "Quilaco", "Quilleco", "San Rosendo", "Santa Bárbara", "Tucapel", "Yumbel", "Alto Biobío", "Lebu", "Arauco", "Cañete", "Contulmo", "Curanilahue", "Los Álamos", "Tirúa"],
        "Región de La Araucanía": ["Temuco", "Carahue", "Cunco", "Curarrehue", "Freire", "Galvarino", "Gorbea", "Lautaro", "Loncoche", "Melipeuco", "Nueva Imperial", "Padre Las Casas", "Perquenco", "Pitrufquén", "Pucón", "Saavedra", "Teodoro Schmidt", "Toltén", "Vilcún", "Villarrica", "Cholchol", "Angol", "Collipulli", "Curacautín", "Ercilla", "Lonquimay", "Los Sauces", "Lumaco", "Purén", "Renaico", "Traiguén", "Victoria"],
        "Región de Los Ríos": ["Valdivia", "Corral", "Lanco", "Los Lagos", "Máfil", "Mariquina", "Paillaco", "Panguipulli", "La Unión", "Futrono", "Lago Ranco", "Río Bueno"],
        "Región de Los Lagos": ["Puerto Montt", "Calbuco", "Cochamó", "Fresia", "Frutillar", "Los Muermos", "Llanquihue", "Maullín", "Puerto Varas", "Castro", "Ancud", "Chonchi", "Curaco de Vélez", "Dalcahue", "Puqueldón", "Queilén", "Quellón", "Quemchi", "Quinchao", "Osorno", "Puerto Octay", "Purranque", "Puyehue", "Río Negro", "San Juan de la Costa", "San Pablo", "Chaitén", "Futaleufú", "Hualaihué", "Palena"],
        "Región de Aysén del Gral. Carlos Ibáñez del Campo": ["Coyhaique", "Lago Verde", "Aysén", "Cisnes", "Guaitecas", "Cochrane", "O'Higgins", "Tortel", "Chile Chico", "Río Ibáñez"],
        "Región de Magallanes y de la Antártica Chilena": ["Punta Arenas", "Laguna Blanca", "Río Verde", "San Gregorio", "Cabo de Hornos", "Antártica", "Porvenir", "Primavera", "Timaukel", "Natales", "Torres del Paine"]
    };

    document.addEventListener('DOMContentLoaded', function() {
        M.FormSelect.init(document.querySelectorAll('select'));
    });

    const regionSelect = document.getElementById('BillToState');
    const comunaSelect = document.getElementById('County');

    regionSelect.addEventListener('change', function() {
        const comunas = ChileData[this.value] || [];
        comunaSelect.innerHTML = '<option value="" disabled selected>Seleccione una Comuna</option>';
        
        comunas.forEach(comuna => {
            let opt = document.createElement('option');
            opt.value = comuna;
            opt.textContent = comuna;
            comunaSelect.appendChild(opt);
        });
        
        M.FormSelect.init(comunaSelect);
    });

    // ALGORITMO MÓDULO 11
    function validarRutChileno(rut) {
        let valor = rut.replace(/\./g, '').replace('-', '').trim();
        if (valor.length < 2) return false;

        let cuerpo = valor.slice(0, -1);
        let dv = valor.slice(-1).toUpperCase();

        if (!/^\d+$/.test(cuerpo)) return false;

        let suma = 0;
        let multiplo = 2;

        for (let i = 1; i <= cuerpo.length; i++) {
            suma += multiplo * cuerpo.charAt(cuerpo.length - i);
            if (multiplo < 7) multiplo++; else multiplo = 2;
        }

        let dvEsperado = 11 - (suma % 11);
        if (dvEsperado === 11) dvEsperado = '0';
        else if (dvEsperado === 10) dvEsperado = 'K';

        return dvEsperado.toString() === dv;
    }

    // FORMATEADORES DINÁMICOS
    const rutInput = document.getElementById('FederalTaxID');
    const rutErrorSpan = document.getElementById('rut-error');
    const firmanteRutInput = document.getElementById('C1_Rut');
    const firmanteRutErrorSpan = document.getElementById('c1-rut-error');

    function formatearYValidar(input, errorSpan) {
        let limpio = input.value.replace(/\./g, '').replace('-', '').trim();
        if(limpio.length > 1) {
            let cuerpo = limpio.slice(0, -1);
            let dv = limpio.slice(-1).toUpperCase();
            input.value = cuerpo + '-' + dv;
        }
        if (!validarRutChileno(input.value) && limpio !== "") {
            errorSpan.textContent = '❌ RUT inválido o falso.';
            input.classList.add('invalid');
        } else {
            errorSpan.textContent = '';
            input.classList.remove('invalid');
        }
    }

    rutInput.addEventListener('blur', function() { formatearYValidar(this, rutErrorSpan); });
    firmanteRutInput.addEventListener('blur', function() { formatearYValidar(this, firmanteRutErrorSpan); });

    const WEBHOOK_REGISTRO_BP = 'https://alogroup.app.n8n.cloud/webhook/sap/registerBP';

    document.getElementById('registro-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Validar ambos RUTs estrictamente antes de gatillar n8n
        if (!validarRutChileno(rutInput.value) || !validarRutChileno(firmanteRutInput.value)) {
            M.toast({html: '❌ Corrija los RUTs inválidos antes de enviar.', classes: 'red darken-1'});
            return;
        }

        const btnEnviar = document.getElementById('btn-enviar');
        btnEnviar.setAttribute('disabled', 'disabled');
        btnEnviar.innerText = 'Enviando solicitud...';

        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        const regionMap = {
            'Región de Arica y Parinacota': '15', 'Región de Tarapacá': '1', 'Región de Antofagasta': '2',
            'Región de Atacama': '3', 'Región de Coquimbo': '4', 'Región de Valparaíso': '5',
            "Región del Libertador Gral. Bernardo O'Higgins": '6', 'Región del Maule': '7', 'Región del Biobío': '8',
            'Región de La Araucanía': '9', 'Región de Los Ríos': '14', 'Región de Los Lagos': '10',
            'Región de Aysén del Gral. Carlos Ibáñez del Campo': '11', 'Región de Magallanes y de la Antártica Chilena': '12',
            'Región Metropolitana de Santiago': '13', 'Región de Ñuble': '16'
        };

        if (data.BillToState && regionMap[data.BillToState]) {
            data.BillToState = regionMap[data.BillToState];
        }

        try {
            const response = await fetch(WEBHOOK_REGISTRO_BP, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                M.toast({html: '✅ Solicitud enviada correctamente.', classes: 'green darken-1'});
                document.getElementById('registro-form').classList.add('hide');
                document.getElementById('success-message').classList.remove('hide');

                setTimeout(() => { window.location.href = 'https://alorental.cl/'; }, 3000);
            } else {
                throw new Error('Error en el servidor');
            }
        } catch (error) {
            btnEnviar.removeAttribute('disabled');
            btnEnviar.innerText = 'Enviar Solicitud de Creación';
            M.toast({html: '❌ Error al enviar la solicitud.', classes: 'red darken-1'});
        }
    });
</script>
</body>
</html>
