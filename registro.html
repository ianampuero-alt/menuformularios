<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Nuevo Cliente (BP) - SAP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        body { background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin-top: 30px; }
        .card-panel { padding: 30px; border-radius: 8px; }
        h4, h5 { color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 8px; margin-top: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .contact-section { background: #fafafa; padding: 20px; border-left: 4px solid #0056b3; margin-bottom: 20px; border-radius: 0 4px 4px 0; }
        .btn-submit { width: 100%; margin-top: 20px; background-color: #0056b3 !important; }
        .hide { display: none !important; }
        .input-field .select-wrapper { width: 100%; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card-panel grey lighten-5 z-depth-1">
        <h4 class="center-align" style="border: none; margin-top: 0;">Solicitud de Creación de Cliente</h4>
        
        <form id="registro-form">
            
            <h5>Datos de la Empresa</h5>
            <div class="grid">
                <div class="input-field"><input id="CardName" type="text" name="CardName" required><label for="CardName">Nombre Razón Social</label></div>
                <div class="input-field"><input id="FederalTaxID" type="text" name="FederalTaxID" required><label for="FederalTaxID">RUT</label></div>
                <div class="input-field"><input id="Address" type="text" name="Address" required><label for="Address">Dirección</label></div>
                <div class="input-field"><input id="City" type="text" name="City" required><label for="City">Ciudad</label></div>
                <div class="input-field"><input id="County" type="text" name="County" required><label for="County">Comuna</label></div>
                
                <div class="input-field">
                    <select id="BillToState" name="BillToState" required>
                        <option value="" disabled selected>Seleccione una Región</option>
                        <option value="Región Metropolitana de Santiago">Región Metropolitana de Santiago</option>
                        <option value="Región de Arica y Parinacota">Región de Arica y Parinacota</option>
                        <option value="Región de Tarapacá">Región de Tarapacá</option>
                        <option value="Región de Antofagasta">Región de Antofagasta</option>
                        <option value="Región de Atacama">Región de Atacama</option>
                        <option value="Región de Coquimbo">Región de Coquimbo</option>
                        <option value="Región de Valparaíso">Región de Valparaíso</option>
                        <option value="Región del Libertador Gral. Bernardo O'Higgins">Región del Libertador Gral. Bernardo O'Higgins</option>
                        <option value="Región del Maule">Región del Maule</option>
                        <option value="Región del Biobío">Región del Biobío</option>
                        <option value="Región de La Araucanía">Región de La Araucanía</option>
                        <option value="Región de Los Ríos">Región de Los Ríos</option>
                        <option value="Región de Los Lagos">Región de Los Lagos</option>
                        <option value="Región de Aysén del Gral. Carlos Ibáñez del Campo">Región de Aysén del Gral. Carlos Ibáñez del Campo</option>
                        <option value="Región de Magallanes y de la Antártica Chilena">Región de Magallanes y de la Antártica Chilena</option>
                        <option value="Región de Ñuble">Región de Ñuble</option>
                    </select>
                    <label for="BillToState">Región</label>
                </div>

                <div class="input-field"><input id="U_NXGiro" type="text" name="U_NXGiro" required><label for="U_NXGiro">Giro Comercial</label></div>
                <div class="input-field"><input id="EmailAddress" type="email" name="EmailAddress" required><label for="EmailAddress">Correo Electrónico General</label></div>
            </div>

            <h5>Contacto 1: Firmante o Representante Legal (RRLL)</h5>
            <div class="contact-section grid">
                <div class="input-field"><input id="C1_FirstName" type="text" name="C1_FirstName" required><label for="C1_FirstName">Nombres</label></div>
                <div class="input-field"><input id="C1_LastName" type="text" name="C1_LastName" required><label for="C1_LastName">Apellidos</label></div>
                <div class="input-field"><input id="C1_Email" type="email" name="C1_Email" required><label for="C1_Email">Correo Electrónico</label></div>
                <div class="input-field"><input id="C1_Pager" type="text" name="C1_Pager" required><label for="C1_Pager">Teléfono</label></div>
            </div>

            <h5>Contacto 2: Pago a Proveedores</h5>
            <div class="contact-section grid">
                <div class="input-field"><input id="C2_FirstName" type="text" name="C2_FirstName" required><label for="C2_FirstName">Nombres</label></div>
                <div class="input-field"><input id="C2_LastName" type="text" name="C2_LastName" required><label for="C2_LastName">Apellidos</label></div>
                <div class="input-field"><input id="C2_Email" type="email" name="C2_Email" required><label for="C2_Email">Correo Electrónico</label></div>
                <div class="input-field"><input id="C2_Pager" type="text" name="C2_Pager" required><label for="C2_Pager">Teléfono</label></div>
            </div>

            <button type="submit" id="btn-enviar" class="btn waves-effect waves-light btn-submit">Enviar Solicitud de Creación</button>
        </form>

        <div id="success-message" class="center-align hide">
            <h5 style="color: #4CAF50; border: none;">¡Solicitud Enviada con Éxito!</h5>
            <p>Su requerimiento pasará a un proceso de validación interna. Nos pondremos en contacto pronto.</p>
            <p style="color: #757575; font-size: 0.9rem; margin-top: 15px;">Redirigiendo a alorental.cl...</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);
    });

    const WEBHOOK_REGISTRO_BP = 'https://alogroup.app.n8n.cloud/webhook-test/sap/registerBP';

    document.getElementById('registro-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btnEnviar = document.getElementById('btn-enviar');
        btnEnviar.setAttribute('disabled', 'disabled');
        btnEnviar.innerText = 'Enviando solicitud...';

        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        // 👇 TU MAPA DE REGIONES INCORPORADO 👇
        const regionMap = {
            'Región de Arica y Parinacota': '15',
            'Región de Tarapacá': '1',
            'Región de Antofagasta': '2',
            'Región de Atacama': '3',
            'Región de Coquimbo': '4',
            'Región de Valparaíso': '5',
            "Región del Libertador Gral. Bernardo O'Higgins": '6',
            'Región del Maule': '7',
            'Región del Biobío': '8',
            'Región de La Araucanía': '9',
            'Región de Los Ríos': '14',
            'Región de Los Lagos': '10',
            'Región de Aysén del Gral. Carlos Ibáñez del Campo': '11',
            'Región de Magallanes y de la Antártica Chilena': '12',
            'Región Metropolitana de Santiago': '13',
            'Región de Ñuble': '16'
        };

        // Si la región existe en el mapa, la transformamos a su ID numérico para SAP
        if (data.BillToState && regionMap[data.BillToState]) {
            data.BillToState = regionMap[data.BillToState];
        }
        // 👆 FIN DEL MAPEO 👆

        try {
            const response = await fetch(WEBHOOK_REGISTRO_BP, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                M.toast({html: '✅ Solicitud enviada correctamente.', classes: 'green darken-1'});
                document.getElementById('registro-form').classList.add('hide');
                document.getElementById('success-message').classList.remove('hide');

                setTimeout(() => {
                    window.location.href = 'https://alorental.cl/';
                }, 3000);

            } else {
                throw new Error('Error en el servidor');
            }
        } catch (error) {
            btnEnviar.removeAttribute('disabled');
            btnEnviar.innerText = 'Enviar Solicitud de Creación';
            M.toast({html: '❌ Error al enviar la solicitud. Intente nuevamente.', classes: 'red darken-1'});
        }
    });
</script>
</body>
</html>
