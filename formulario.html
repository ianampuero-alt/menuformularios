<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualizar datos · ALO Group</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-1: #0F161E;
            --navy-2: #16232E;
            --navy-3: #22374A;
            --azure:  #3E8ED0;
            --azure-2:#2F7FC4;
            --azure-3:#57A6E8;
            --amber:  #F0851E;

            --char:   #0F1A24;
            --paper:  #F4F7FA;
            --paper-2:#FFFFFF;
            --line:   #DDE5EE;
            --muted:  #6B7A8C;

            /* nombres corporativos apuntando al azul */
            --color-primario:   #2F7FC4;
            --color-secundario: #3E8ED0;
            --color-texto:      #0F1A24;
            --color-apoyo:      #16232E;

            --display: 'Bricolage Grotesque', system-ui, sans-serif;
            --body: 'Inter', system-ui, sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--paper);
            padding: 0; margin: 0;
            color: var(--char);
            font-family: var(--body);
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- TOP BRAND BAR ---------- */
        .topbar {
            position: relative; overflow: hidden;
            padding: 22px 32px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            color: #EAF2FB;
            background:
                radial-gradient(120% 160% at 100% 0%, rgba(62,142,208,.30) 0%, rgba(62,142,208,0) 45%),
                linear-gradient(120deg, var(--navy-3) 0%, var(--navy-2) 45%, var(--navy-1) 100%);
        }
        .topbar::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(118deg, rgba(255,255,255,0) 32%, rgba(120,170,220,.14) 47%, rgba(160,200,240,.05) 53%, rgba(255,255,255,0) 62%);
        }
        .topbar::after {
            content: ""; position: absolute;
            width: 360px; height: 360px; right: -140px; top: -200px;
            background: radial-gradient(circle, rgba(62,142,208,.38) 0%, rgba(62,142,208,0) 70%);
            filter: blur(6px); animation: breathe 7s ease-in-out infinite; pointer-events: none;
        }
        @keyframes breathe { 0%,100% { transform: scale(1); opacity:.7; } 50% { transform: scale(1.12); opacity:1; } }

        .brand-logo { position: relative; z-index: 1; display: flex; align-items: center; }
        .brand-logo img { height: 36px; width: auto; display: block; }

        .btn-back {
            position: relative; z-index: 1;
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(234,242,251,.1) !important;
            border: 1px solid rgba(234,242,251,.25) !important;
            color: #EAF2FB !important; cursor: pointer;
            font-family: var(--body); font-size: .88rem; font-weight: 600;
            padding: 9px 16px; border-radius: 10px; height: auto; line-height: 1.4;
            box-shadow: none; text-transform: none;
        }
        .btn-back:hover { background: rgba(234,242,251,.18) !important; border-color: rgba(234,242,251,.45) !important; }
        .btn-back i { margin: 0 !important; }

        /* ---------- LAYOUT ---------- */
        .container { max-width: 860px; margin: 40px auto; padding: 0 24px; }
        .card-panel { padding: 36px 34px !important; border-radius: 20px !important; background: var(--paper-2) !important; border: 1.5px solid var(--line); box-shadow: 0 10px 30px rgba(15,26,36,.06) !important; }

        h4 { font-family: var(--display); font-weight: 700; color: var(--char); border: none; letter-spacing: -.5px; }
        .form-eyebrow { text-align: center; font-size: .72rem; letter-spacing: 3px; text-transform: uppercase; color: var(--azure-2); font-weight: 600; margin-bottom: 10px; }
        .form-sub { text-align: center; color: var(--muted); margin: 8px 0 6px; }

        /* Encabezados de sección */
        h5 {
            font-family: var(--display); font-weight: 700; font-size: 1.15rem;
            color: var(--char); letter-spacing: -.3px;
            border-bottom: none; padding: 0 0 0 14px; margin: 38px 0 16px;
            position: relative;
        }
        h5::before {
            content: ""; position: absolute; left: 0; top: 3px; bottom: 3px;
            width: 4px; border-radius: 3px; background: var(--azure);
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; }

        .contact-section {
            background: #F8FAFC;
            padding: 20px 22px 6px;
            border-left: 4px solid var(--azure);
            margin-bottom: 20px;
            border-radius: 0 14px 14px 0;
            border: 1.5px solid var(--line); border-left-width: 4px;
        }

        /* ---------- INPUTS (Materialize recoloreado) ---------- */
        .input-field > label { color: var(--muted); }
        .input-field > label.active { color: var(--muted); }
        input[type=text], input[type=email], input[type=tel] { color: var(--char); }

        input[type=text]:focus:not([readonly]),
        input[type=email]:focus:not([readonly]),
        input[type=tel]:focus:not([readonly]) {
            border-bottom: 1px solid var(--azure) !important;
            box-shadow: 0 1px 0 0 var(--azure) !important;
        }
        input[type=text]:focus:not([readonly]) + label,
        input[type=email]:focus:not([readonly]) + label,
        input[type=tel]:focus:not([readonly]) + label { color: var(--azure) !important; }

        input.valid:not([readonly]) { border-bottom: 1px solid #2E7D46 !important; box-shadow: 0 1px 0 0 #2E7D46 !important; }
        input.invalid:not([readonly]) { border-bottom: 1px solid #C0341D !important; box-shadow: 0 1px 0 0 #C0341D !important; }

        input[readonly] { color: var(--muted) !important; border-bottom: 1px dashed #C6D2DE !important; }

        .input-field .select-wrapper { width: 100%; }
        .select-wrapper input.select-dropdown:focus { border-bottom: 1px solid var(--azure); }
        .dropdown-content li > a, .dropdown-content li > span { color: var(--azure-2) !important; }
        .dropdown-content li.selected { background-color: rgba(62,142,208,.12); }
        .select-wrapper.valid input.select-dropdown { border-bottom: 1px solid #2E7D46; box-shadow: 0 1px 0 0 #2E7D46; }
        .select-wrapper.invalid input.select-dropdown { border-bottom: 1px solid #C0341D; box-shadow: 0 1px 0 0 #C0341D; }

        .helper-text.red-text { color: #C0341D !important; }

        /* ---------- BOTONES ---------- */
        .btn-container { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .btn-submit {
            background-color: var(--azure-2) !important; color: #fff !important;
            font-family: var(--display); font-weight: 700; text-transform: none;
            flex-grow: 1; border-radius: 12px !important; height: 48px; line-height: 48px;
            box-shadow: 0 6px 18px rgba(47,127,196,.32) !important;
        }
        .btn-submit:hover { background-color: var(--azure) !important; }

        /* ---------- LOADER ---------- */
        .loader-overlay {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background-color: rgba(15,22,30,.82);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; color: #EAF2FB; text-align: center;
        }
        .loader-spinner {
            border: 4px solid rgba(234,242,251,.25);
            border-top: 4px solid var(--azure-3);
            border-radius: 50%; width: 52px; height: 52px; animation: spin 1s linear infinite; margin-bottom: 14px;
        }
        .loader-text { font-family: var(--display); font-size: 1.15em; font-weight: 700; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ---------- ÉXITO ---------- */
        .progress { background-color: rgba(62,142,208,.2); }
        .progress .indeterminate { background-color: var(--azure); }

        .hide { display: none !important; }

        /* SweetAlert azul */
        .swal2-popup { font-family: var(--body) !important; border-radius: 18px !important; }
        .swal2-title { font-family: var(--display) !important; color: var(--char) !important; }
        .swal2-html-container { color: var(--muted) !important; }
        .swal2-styled.swal2-confirm { border-radius: 12px !important; font-family: var(--display) !important; font-weight: 700 !important; }

        @media (max-width: 600px) {
            .topbar { padding: 16px 18px; }
            .brand-logo img { height: 64px; }
            .container { margin: 26px auto; padding: 0 16px; }
            .card-panel { padding: 24px 20px !important; }
            .grid { grid-template-columns: 1fr; }
            .btn-container { flex-direction: column; }
        }
        @media (prefers-reduced-motion: reduce) { .topbar::after { animation: none !important; } }
    </style>
</head>

<div class="container">
    <div class="card-panel z-depth-1">
        <div class="form-eyebrow">Portal de servicios</div>
        <h4 class="center-align" style="margin-top: 0;">Actualiza tus datos</h4>
        <p class="form-sub">Revisa la información de tu empresa y tus contactos. Guarda los cambios cuando esté todo correcto.</p>

        <form id="myForm">

            <h5>Datos de la empresa</h5>
            <div class="grid">
                <div class="input-field" style="grid-column: span 2;">
                    <input id="RutEmpresa" type="text" class="validate" name="RutEmpresa" required readonly>
                    <label for="RutEmpresa" class="active">RUT empresa (sin puntos y con guion)</label>
                </div>

                <div class="input-field" style="grid-column: span 2;">
                    <input id="RazonSocial" type="text" class="validate" name="RazonSocial" required>
                    <label for="RazonSocial" class="active">Razón social</label>
                </div>

                <div class="input-field">
                    <select id="Industria" name="Industria" required>
                        <option value="" disabled selected>Seleccione una industria</option>
                        <option value="Construcción">Construcción</option>
                        <option value="Minería">Minería</option>
                        <option value="Servicios de ingeniería">Servicios de ingeniería</option>
                        <option value="Transporte, logística y almacenamiento">Transporte, logística y almacenamiento</option>
                        <option value="Comercio de maquinaria">Comercio de maquinaria</option>
                        <option value="Soluciones tecnológicas">Soluciones tecnológicas</option>
                        <option value="Agrícola y forestal">Agrícola y forestal</option>
                        <option value="Comercio general">Comercio general</option>
                        <option value="Energía">Energía</option>
                        <option value="Sector público">Sector público</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <label>Industria / Giro</label>
                </div>
                <div class="input-field">
                    <input id="CalleNumero" type="text" class="validate" name="CalleNumero" required>
                    <label for="CalleNumero" class="active">Calle y número</label>
                </div>

                <div class="input-field">
                    <select id="Region" name="Region" required>
                        <option value="" disabled selected>Seleccione una región</option>
                        <option value="Región de Arica y Parinacota">Arica y Parinacota</option>
                        <option value="Región de Tarapacá">Tarapacá</option>
                        <option value="Región de Antofagasta">Antofagasta</option>
                        <option value="Región de Atacama">Atacama</option>
                        <option value="Región de Coquimbo">Coquimbo</option>
                        <option value="Región de Valparaíso">Valparaíso</option>
                        <option value="Región del Libertador Gral. Bernardo O'Higgins">O'Higgins</option>
                        <option value="Región del Maule">Maule</option>
                        <option value="Región de Ñuble">Ñuble</option>
                        <option value="Región del Biobío">Biobío</option>
                        <option value="Región de La Araucanía">Araucanía</option>
                        <option value="Región de Los Ríos">Los Ríos</option>
                        <option value="Región de Los Lagos">Los Lagos</option>
                        <option value="Región de Aysén del Gral. Carlos Ibáñez del Campo">Aysén</option>
                        <option value="Región de Magallanes y de la Antártica Chilena">Magallanes</option>
                        <option value="Región Metropolitana de Santiago">Metropolitana de Santiago</option>
                    </select>
                    <label>Región</label>
                </div>

                <div class="input-field">
                    <select id="City" name="City" required>
                        <option value="" disabled selected>Seleccione primero una región</option>
                    </select>
                    <label>Ciudad</label>
                </div>

                <div class="input-field" style="grid-column: span 2;">
                    <select id="Comuna" name="Comuna" required>
                        <option value="" disabled selected>Seleccione primero una región</option>
                    </select>
                    <label>Comuna</label>
                </div>
            </div>

            <h5>Contacto 1 · Firmante o representante legal (RRLL)</h5>
            <div class="contact-section grid">
                <div class="input-field"><input id="NombreAdq" type="text" name="NombreAdq" required><label for="NombreAdq" class="active">Nombre completo</label></div>
                <div class="input-field">
                    <input id="RutAdq" type="text" name="RutAdq" required placeholder="12345678-9">
                    <label for="RutAdq" class="active">RUT del contacto</label>
                    <span id="rut-adq-error" class="helper-text red-text"></span>
                </div>
                <div class="input-field"><input id="EmailAdq" type="email" name="EmailAdq" required><label for="EmailAdq" class="active">Email</label></div>
                <div class="input-field">
                    <input id="FonoAdq" type="tel" name="FonoAdq" required placeholder="+56912345678">
                    <label for="FonoAdq" class="active">Teléfono</label>
                </div>
            </div>

            <h5>Contacto 2 · Pago a proveedores</h5>
            <div class="contact-section grid">
                <div class="input-field"><input id="NombrePago" type="text" name="NombrePago" required><label for="NombrePago" class="active">Nombre completo</label></div>
                <div class="input-field"><input id="EmailPago" type="email" name="EmailPago" required><label for="EmailPago" class="active">Correo electrónico</label></div>
                <div class="input-field" style="grid-column: span 2;">
                    <input id="FonoPago" type="tel" name="FonoPago" required placeholder="+56912345678">
                    <label for="FonoPago" class="active">Teléfono móvil</label>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn waves-effect waves-light btn-submit" type="submit" name="action">
                    Guardar cambios
                    <i class="material-icons right">send</i>
                </button>
            </div>
        </form>
    </div>
</div>

    document.addEventListener('DOMContentLoaded', function() {
        M.FormSelect.init(document.querySelectorAll('select'));

        const storedRut = sessionStorage.getItem('sapRut');

        if (!storedRut || !storedData) {

                this.value = limpio.slice(0, -1) + '-' + limpio.slice(-1).toUpperCase();

            if (!validaRut(this.value) && limpio !== "") {

                this.classList.add('invalid');

                errSpan.textContent = '';
                this.classList.remove('invalid');

                M.updateTextFields();
                validarCampos(true);
            });
        });
    });

    function formatPhoneValue(val) {
        if (!val) return '';
        let clean = val.trim().replace(/[\s\-()]/g, '');
        if (/^9\d{8}$/.test(clean)) return '+56' + clean;
        if (/^569\d{8}$/.test(clean)) return '+' + clean;
        if (clean.startsWith('+56')) return clean;
        return clean.startsWith('56') ? '+' + clean : '+56' + clean;
    }

    function norm(s) {
        return (s || '').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function populateComunasYCiudades(regionNombre, comunaSeleccionada = '', ciudadSeleccionada = '') {
        const comunaSelect = document.getElementById('Comuna');
        const citySelect = document.getElementById('City');

        const comunas = ChileData[regionNombre] || [];
        comunaSelect.innerHTML = '<option value="" disabled selected>Seleccione una comuna</option>';
        let comunaMatch = '';
        comunas.forEach(comuna => {
            const t = comuna.trim();
            let opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            comunaSelect.appendChild(opt);
            if (norm(t) === norm(comunaSeleccionada)) comunaMatch = t;
        });
        if (comunaMatch) comunaSelect.value = comunaMatch;   // fuerza el valor canónico exacto
        M.FormSelect.init(comunaSelect);

        const ciudades = ChileCities[regionNombre] || [];
        citySelect.innerHTML = '<option value="" disabled selected>Seleccione una ciudad</option>';
        let ciudadMatch = '';
        ciudades.forEach(ciudad => {
            const t = ciudad.trim();
            let opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            citySelect.appendChild(opt);
            if (norm(t) === norm(ciudadSeleccionada)) ciudadMatch = t;
        });
        if (ciudadMatch) citySelect.value = ciudadMatch;     // fuerza el valor canónico exacto
        M.FormSelect.init(citySelect);
    }

    function fillForm(data) {
        console.log('[formulario v2] datos recibidos:', data);
        document.getElementById('RazonSocial').value = data.CardName || '';
        document.getElementById('Industria').value = data.Industria || '';
        
        if (data.Direccion) {
            document.getElementById('CalleNumero').value = data.Direccion.Calle || '';
            document.getElementById('Region').value = data.Direccion.Region || '';

            let comunaDetectada = data.Direccion.Comuna || '';
            let ciudadDetectada = data.Direccion.Ciudad || '';

            populateComunasYCiudades(data.Direccion.Region, comunaDetectada, ciudadDetectada);
            // La preselección (normalizada, sin tildes/mayúsculas) ya la hace populateComunasYCiudades.
        }

        if (data.Contactos && data.Contactos.Adquisiciones) {
            document.getElementById('NombreAdq').value = data.Contactos.Adquisiciones.Nombre || '';
            document.getElementById('RutAdq').value = data.Contactos.Adquisiciones.Rut || '';
            document.getElementById('EmailAdq').value = data.Contactos.Adquisiciones.Email || '';
            document.getElementById('FonoAdq').value = formatPhoneValue(data.Contactos.Adquisiciones.Fono || '');
        }
        if (data.Contactos && data.Contactos.PagoProveedores) {
            document.getElementById('NombrePago').value = data.Contactos.PagoProveedores.Nombre || '';
            document.getElementById('EmailPago').value = data.Contactos.PagoProveedores.Email || '';
            document.getElementById('FonoPago').value = formatPhoneValue(data.Contactos.PagoProveedores.Fono || '');
        }

        M.updateTextFields();
        M.FormSelect.init(document.querySelectorAll('select'));
        validarCampos(true); 
    }

    function validarCampos(isInitialLoad = false) {
        let formIsValid = true;
        ALL_CONTACT_FIELDS.forEach(fieldId => {
            const input = document.getElementById(fieldId);
            if (!input) return;
            const value = input.value ? input.value.trim() : '';
            const container = input.tagName === 'SELECT' ? input.closest('.select-wrapper') : input;
            
            if (value === '') {
                container.classList.remove('valid', 'invalid');
                formIsValid = false;
                return; 
            }
            
            let isFormatValid = true;
            if (fieldId === 'RutAdq' && !validaRut(value)) isFormatValid = false;
            if ((fieldId === 'EmailAdq' || fieldId === 'EmailPago') && !isValidEmail(value)) isFormatValid = false;
            if ((fieldId === 'FonoAdq' || fieldId === 'FonoPago') && !isValidPhone(value)) isFormatValid = false;
            
            if (!isFormatValid) {
                formIsValid = false;
                if (!isInitialLoad) { container.classList.remove('valid'); container.classList.add('invalid'); }
            } else {
                if (!isInitialLoad) { container.classList.remove('invalid'); container.classList.add('valid'); }
            }
        });
        return formIsValid;
    }

    document.getElementById('myForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        ALL_CONTACT_FIELDS.forEach(fieldId => {
            const input = document.getElementById(fieldId);
            if(!input) return;
            const value = input.value ? input.value.trim() : '';
            const container = input.tagName === 'SELECT' ? input.closest('.select-wrapper') : input;
            if(value === '') { container.classList.add('invalid'); }
        });

        if (!validarCampos(false)) {
            M.toast({html: '❌ Revise los campos obligatorios o inválidos.', classes: 'red darken-1'});
            return;
        }

        const formData = new FormData(event.target);
        const dataObject = {};
        formData.forEach((value, key) => { dataObject[key] = value.trim(); });
        const storedData = JSON.parse(sessionStorage.getItem('sapClientData'));
        const clientData = storedData.data ? storedData.data : storedData;
        dataObject.CardCode = clientData.CardCode;

        showLoader("Enviando a SAP...");
        try {
            const response = await fetch(WEBHOOK_UPDATE_BP, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataObject)
            });
            const result = await response.json();
            hideLoader();
            if (response.ok && result.success) {
                M.toast({html: '✅ Actualizado exitosamente', classes: 'green darken-1'});
                document.querySelector('.container').innerHTML = `
                    <div class="card-panel center-align" style="margin-top: 20px; padding: 48px 34px;">
                        <div style="width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:rgba(46,125,70,.12);display:grid;place-items:center;">
                          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#2E7D46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                        </div>
                        <h4 style="color:#2E7D46; border:none; margin-top:0;">¡Listo!</h4>
                        <p style="font-size:1.05rem;">Tus datos quedaron actualizados en SAP.</p>
                        <p class="grey-text">Te llevamos de vuelta al menú…</p>
                        <div class="progress" style="max-width:320px;margin:24px auto 0;"><div class="indeterminate"></div></div>
                    </div>
                `;
                setTimeout(() => { window.location.href = "menucliente.html"; }, 4000);
            } else {
                const sapMsg = result.detail || result.message || 'No se pudo actualizar en SAP.';
                Swal.fire({
                    icon: 'error',
                    title: 'No pudimos guardar tus datos',
                    html: sapMsg,
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#2F7FC4'
                });
            }
        } catch(e) {
            hideLoader();
            Swal.fire({
                icon: 'error',
                title: 'Error de conexión',
                text: 'No pudimos conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.',
                confirmButtonText: 'Reintentar',
                confirmButtonColor: '#2F7FC4'
            });
        }
    });

    function showLoader(msg = "Cargando...") {
        document.getElementById('loaderText').innerText = msg;
        document.getElementById('loader').style.display = 'flex';
    }
    function hideLoader() { document.getElementById('loader').style.display = 'none'; }
    
    function validaRut(rutCompleto) {
        if (!rutCompleto) return false;
        rutCompleto = rutCompleto.replace(/\./g, "").replace("-", "‐");
        if (!/^[0-9]+‐[0-9kK]{1}$/.test(rutCompleto)) return false;
        const tmp = rutCompleto.split('‐');
        return (dv(tmp[0]) == (tmp[1].toLowerCase() == 'k' ? 'k' : tmp[1]));
    }
    
    function dv(T) {
        var M = 0, S = 1;
        for (; T; T = Math.floor(T / 10)) { S = (S + T % 10 * (9 - M++ % 6)) % 11; }
        return S ? S - 1 : 'k';
    }
    function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
    function isValidPhone(phone) {
        if (!phone) return false;
        const limpio = phone.trim().replace(/[\s\-()]/g, '');
        return /^\+56(9\d{8}|[2-8]\d{7})$/.test(limpio);
    }
</script>
