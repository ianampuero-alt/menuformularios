<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualización Cliente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      body { background-color: #f5f5f5; }
      .container { margin-top: 10px; }
      .card-panel { padding: 10px; }
      .input-field { margin-bottom: 2px; margin-top: 2px; }
      .loader-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.7); display: none; flex-direction: column;
        justify-content: center; align-items: center; z-index: 9999; color: white; text-align: center;
      }
      .loader-spinner {
        border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid #fff;
        border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 10px;
      }
      .loader-text { font-size: 1.2em; font-weight: bold; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      .select-wrapper.invalid input.select-dropdown {
        border-bottom: 1px solid #f44336;
        box-shadow: 0 1px 0 0 #f44336;
      }

      .btn-container {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
      }
    </style>
  </head>
  
  <body>
    <div id="loader" class="loader-overlay">
      <div class="loader-spinner"></div>
      <div id="loaderText" class="loader-text">Cargando datos cliente...</div>
    </div>
    
    <div class="container">
      <div class="row">
        <div class="col s12">
          <div class="card-panel grey lighten-5 z-depth-1">
            <h4 class="center-align" style="color: #0056b3;">Actualización de Datos corporativos</h4>
            <div class="row">
              <form class="col s12" id="myForm">
                <div class="row">
                  <div class="input-field col s12">
                    <input id="RutEmpresa" type="text" class="validate" name="RutEmpresa" required readonly>
                    <label for="RutEmpresa" class="active">RUT Empresa (formato sin puntos y con guion)</label>
                  </div>
                </div>
                <div class="row">
                  <div class="input-field col s12">
                    <input id="RazonSocial" type="text" class="validate" name="RazonSocial">
                    <label for="RazonSocial" class="active">Razón Social</label>
                  </div>
                </div>
                
                <div class="row">
                  <div class="input-field col s12">
                    <select id="Industria" name="Industria" required>
                      <option value="" disabled selected>Seleccione una industria</option>
                      <option value="Construcción">Construcción</option>
                      <option value="Minería">Minería</option>
                      <option value="Servicios de ingeniería">Servicios de ingeniería</option>
                      <option value="Transporte, logística y almacenamiento">Transporte, logística y almacenamiento</option>
                      <option value="Comercio de maquinaria">Comercio de maquinaria</option>
                      <option value="Soluciones tecnológicas">Soluciones tecnológicas</option>
                      <option value="Agrícola y forestal">Agrícola y forestal</option>
                      <option value="Comercio general">Comercio general</option>
                      <option value="Energía">Energía</option>
                      <option value="Sector público">Sector público</option>
                      <option value="Otros">Otros</option>
                    </select>
                    <label>Industria</label>
                  </div>
                </div>
                <div class="row">
                  <div class="input-field col s12">
                    <input id="CalleNumero" type="text" class="validate" name="CalleNumero">
                    <label for="CalleNumero" class="active">Calle y Número</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12">
                    <select id="Region" name="Region" required>
                      <option value="" disabled selected>Seleccione una región</option>
                      <option value="Región de Arica y Parinacota">Arica y Parinacota</option>
                      <option value="Región de Tarapacá">Tarapacá</option>
                      <option value="Región de Antofagasta">Antofagasta</option>
                      <option value="Región de Atacama">Atacama</option>
                      <option value="Región de Coquimbo">Coquimbo</option>
                      <option value="Región de Valparaíso">Valparaíso</option>
                      <option value="Región del Libertador Gral. Bernardo O'Higgins">O'Higgins</option>
                      <option value="Región del Maule">Maule</option>
                      <option value="Región de Ñuble">Ñuble</option>
                      <option value="Región del Biobío">Biobío</option>
                      <option value="Región de La Araucanía">Araucanía</option>
                      <option value="Región de Los Ríos">Los Ríos</option>
                      <option value="Región de Los Lagos">Los Lagos</option>
                      <option value="Región de Aysén del Gral. Carlos Ibáñez del Campo">Aysén</option>
                      <option value="Región de Magallanes y de la Antártica Chilena">Magallanes</option>
                      <option value="Región Metropolitana de Santiago">Metropolitana de Santiago</option>
                    </select>
                    <label>Región</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12">
                    <select id="City" name="City" required>
                      <option value="" disabled selected>Seleccione primero una región</option>
                    </select>
                    <label>Ciudad</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12">
                    <select id="Comuna" name="Comuna" required>
                      <option value="" disabled selected>Seleccione primero una región</option>
                    </select>
                    <label>Comuna</label>
                  </div>
                </div>

                <div class="row">
                  <h6 class="center-align">Contacto de Adquisiciones para Firma electrónica</h6>
                  <div class="input-field col s12">
                    <input id="NombreAdq" type="text" name="NombreAdq">
                    <label for="NombreAdq" class="active">Nombre</label>
                  </div>
                  <div class="input-field col s12">
                    <input id="RutAdq" type="text" name="RutAdq">
                    <label for="RutAdq" class="active">RUT del contacto</label>
                  </div>
                  <div class="input-field col s12">
                    <input id="EmailAdq" type="email" name="EmailAdq">
                    <label for="EmailAdq" class="active">Email</label>
                  </div>
                  <div class="input-field col s12">
                    <input id="FonoAdq" type="tel" name="FonoAdq" placeholder="+56912345678">
                    <label for="FonoAdq" class="active">Fono</label>
                  </div>
                </div>
                <div class="row">
                  <h6 class="center-align">Contacto de Pago a Proveedores</h6>
                  <div class="input-field col s12">
                    <input id="NombrePago" type="text" name="NombrePago">
                    <label for="NombrePago" class="active">Nombre completo contacto PP</label>
                  </div>
                  <div class="input-field col s12">
                    <input id="EmailPago" type="email" name="EmailPago">
                    <label for="EmailPago" class="active">Correo electrónico PP</label>
                  </div>
                  <div class="input-field col s12">
                    <input id="FonoPago" type="tel" name="FonoPago" placeholder="+56912345678">
                    <label for="FonoPago" class="active">Teléfono móvil PP</label>
                  </div>
                </div>
                
                <div class="row">
                  <div class="input-field col s12 btn-container">
                    <button class="btn waves-effect waves-light" type="submit" name="action">
                      Actualizar en SAP
                      <i class="material-icons right">send</i>
                    </button>
                    
                    <button class="btn waves-effect waves-light grey darken-2" type="button" id="btnBack">
                      Volver Atrás
                      <i class="material-icons left">arrow_back</i>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
      const WEBHOOK_UPDATE_BP = 'https://alogroup.app.n8n.cloud/webhook/sap/updateBP';

      const ChileData = {
        "Región Metropolitana de Santiago": ["Cerrillos", "Cerro Navia", "Conchalí", "El Bosque", "Estación Central", "Huechuraba", "Independencia", "La Cisterna", "La Florida", "La Granja", "La Pintana", "La Reina", "Las Condes", "Lo Barnechea", "Lo Espejo", "Lo Prado", "Macul", "Maipú", "Ñuñoa", "Pedro Aguirre Cerda", "Peñalolén", "Providencia", "Pudahuel", "Puente Alto", "Quilicura", "Quinta Normal", "Recoleta", "Renca", "San Bernardo", "San Joaquín", "San Miguel", "San Ramón", "Santiago", "Vitacura", "Colina", "Lampa", "Tiltil", "Pirque", "San José de Maipo", "Buin", "Calera de Tango", "Paine", "Melipilla", "Alhué", "Curacaví", "María Pinto", "San Pedro", "Talagante", "El Monte", "Isla de Maipo", "Padre Hurtado", "Peñaflor"],

        "Región de Coquimbo": ["La Serena", "Coquimbo", "Ovalle", "Illapel", "Vicuña"],

      };

        "Región Metropolitana de Santiago": ["Santiago", "Puente Alto", "San Bernardo", "Melipilla", "Talagante", "Buin", "Colina"],
        "Región de Arica y Parinacota": ["Arica", "Putre"],
        "Región de Tarapacá": ["Iquique", "Pozo Almonte"],
        "Región de Antofagasta": ["Antofagasta", "Calama", "Tocopilla", "Mejillones"],
        "Región de Atacama": ["Copiapó", "Vallenar", "Chañaral"],
        "Región de Coquimbo": ["La Serena", "Coquimbo", "Ovalle", "Illapel", "Vicuña"],
        "Región de Valparaíso": ["Valparaíso", "Viña del Mar", "Quillota", "San Antonio", "San Felipe", "Los Andes", "Quilpué", "Villa Alemana"],
        "Región del Libertador Gral. Bernardo O'Higgins": ["Rancagua", "San Fernando", "Santa Cruz", "San Vicente", "Rengo"],
        "Región del Maule": ["Talca", "Curicó", "Linares", "Cauquenes", "Constitución"],
        "Región de Ñuble": ["Chillán", "San Carlos", "Quirihue"],
        "Región del Biobío": ["Concepción", "Los Ángeles", "Talcahuano", "Coronel", "Lota", "Lebu"],
        "Región de La Araucanía": ["Temuco", "Angol", "Villarrica", "Pucón", "Padre Las Casas"],
        "Región de Los Ríos": ["Valdivia", "La Unión", "Río Bueno"],
        "Región de Los Lagos": ["Puerto Montt", "Osorno", "Castro", "Ancud", "Puerto Varas"],
        "Región de Aysén del Gral. Carlos Ibáñez del Campo": ["Coyhaique", "Puerto Aysén", "Chile Chico"],
        "Región de Magallanes y de la Antártica Chilena": ["Punta Arenas", "Puerto Natales", "Porvenir"]
      };

      const ADQ_FIELDS = ['NombreAdq', 'RutAdq', 'EmailAdq', 'FonoAdq'];
      const PAGO_FIELDS = ['NombrePago', 'EmailPago', 'FonoPago'];
      const ALL_CONTACT_FIELDS = ADQ_FIELDS.concat(PAGO_FIELDS, ['Industria', 'Region', 'City', 'Comuna']);

      document.addEventListener('DOMContentLoaded', function() {
        M.FormSelect.init(document.querySelectorAll('select'));

        const storedRut = sessionStorage.getItem('sapRut');
        const storedData = sessionStorage.getItem('sapClientData');

        if (!storedRut || !storedData) {
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('RutEmpresa').value = storedRut;
        const parsedData = JSON.parse(storedData);
        fillForm(parsedData);

        document.getElementById('btnBack').addEventListener('click', function() {
            window.location.href = 'menucliente.html';
        });

        document.getElementById('Region').addEventListener('change', function() {
            populateComunasYCiudades(this.value);
            validarCampos(false); 
        });

        ALL_CONTACT_FIELDS.forEach(fieldId => {
            const input = document.getElementById(fieldId);
            if (input) {
                const eventType = input.tagName === 'SELECT' ? 'change' : 'input';
                input.addEventListener(eventType, () => { validarCampos(false); });
            }
        });

        ['FonoAdq', 'FonoPago'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('blur', function() {
                this.value = formatPhoneValue(this.value);
                M.updateTextFields();
                validarCampos(false);
            });
        });
      });

      function formatPhoneValue(val) {
        if (!val) return '';
        let clean = val.trim().replace(/[\s\-()]/g, '');
        if (/^9\d{8}$/.test(clean)) return '+56' + clean;
        if (/^569\d{8}$/.test(clean)) return '+' + clean;
        if (clean.startsWith('+56')) return clean;
        return clean.startsWith('56') ? '+' + clean : '+56' + clean;
      }

      function populateComunasYCiudades(regionNombre, comunaSeleccionada = '', ciudadSeleccionada = '') {
        const comunaSelect = document.getElementById('Comuna');
        const citySelect = document.getElementById('City');
        
        const comunas = ChileData[regionNombre] || [];
        comunaSelect.innerHTML = '<option value="" disabled selected>Seleccione una comuna</option>';
        comunas.forEach(comuna => {
            let opt = document.createElement('option');
            opt.value = comuna; opt.textContent = comuna;
            if (comuna === comunaSeleccionada) opt.selected = true;
            comunaSelect.appendChild(opt);
        });
        M.FormSelect.init(comunaSelect);

        const ciudades = ChileCities[regionNombre] || [];
        citySelect.innerHTML = '<option value="" disabled selected>Seleccione una ciudad</option>';
        ciudades.forEach(ciudad => {
            let opt = document.createElement('option');
            opt.value = ciudad; opt.textContent = ciudad;
            if (ciudad === ciudadSeleccionada) opt.selected = true;
            citySelect.appendChild(opt);
        });
        M.FormSelect.init(citySelect);
      }

      function fillForm(data) {
        // 1. DICCIONARIOS TRADUCTORES: Códigos de SAP ➡️ Nombres de Texto para el Formulario
        const industryMapRev = {'1':'Construcción','2':'Minería','27':'Servicios de ingeniería','3':'Transporte, logística y almacenamiento','5':'Comercio de maquinaria','108':'Soluciones tecnológicas','109':'Agrícola y forestal','14':'Comercio general','110':'Energía','8':'Sector público','56':'Otros'};
        const regionMapRev = {'15':'Región de Arica y Parinacota','1':'Región de Tarapacá','2':'Región de Antofagasta','3':'Región de Atacama','4':'Región de Coquimbo','5':'Región de Valparaíso','6':"Región del Libertador Gral. Bernardo O'Higgins",'7':'Región del Maule','8':'Región del Biobío','9':'Región de La Araucanía','14':'Región de Los Ríos','10':'Región de Los Lagos','11':'Región de Aysén del Gral. Carlos Ibáñez del Campo','12':'Región de Magallanes y de la Antártica Chilena','13':'Región Metropolitana de Santiago','16':'Región de Ñuble'};
        
        // Diccionario Inverso para traducir los Códigos de Ciudad que envía tu SAP
        const cityMapRev = {
          'Santiago': 'Santiago', 'STGO': 'Santiago', '13101': 'Santiago',
          'Puente Alto': 'Puente Alto', 'San Bernardo': 'San Bernardo', 'Melipilla': 'Melipilla',
          'Talagante': 'Talagante', 'Buin': 'Buin', 'Colina': 'Colina',
          'Arica': 'Arica', 'Putre': 'Putre', 'Iquique': 'Iquique', 'Pozo Almonte': 'Pozo Almonte',
          'Antofagasta': 'Antofagasta', 'ANTOF': 'Antofagasta', 'Calama': 'Calama', 'CALAM': 'Calama',
          'Tocopilla': 'Tocopilla', 'Mejillones': 'Mejillones', 'Copiapó': 'Copiapó', 'Vallenar': 'Vallenar',
          'Chañaral': 'Chañaral', 'La Serena': 'La Serena', 'Coquimbo': 'Coquimbo', 'Ovalle': 'Ovalle',
          'Illapel': 'Illapel', 'Vicuña': 'Vicuña', 'Valparaíso': 'Valparaíso', 'VALPO': 'Valparaíso',
          'Viña del Mar': 'Viña del Mar', 'Quillota': 'Quillota', 'San Antonio': 'San Antonio',
          'San Felipe': 'San Felipe', 'Los Andes': 'Los Andes', 'Quilpué': 'Quilpué', 'Villa Alemana': 'Villa Alemana',
          'Rancagua': 'Rancagua', 'San Fernando': 'San Fernando', 'Santa Cruz': 'Santa Cruz',
          'San Vicente': 'San Vicente', 'Rengo': 'Rengo', 'Talca': 'Talca', 'Curicó': 'Curicó',
          'Linares': 'Linares', 'Cauquenes': 'Cauquenes', 'Constitución': 'Constitución', 'Chillán': 'Chillán',
          'San Carlos': 'San Carlos', 'Quirihue': 'Quirihue', 'Concepción': 'Concepción', 'CONCE': 'Concepción',
          'Los Ángeles': 'Los Ángeles', 'Talcahuano': 'Talcahuano', 'Coronel': 'Coronel', 'Lota': 'Lota',
          'Lebu': 'Lebu', 'Temuco': 'Temuco', 'Angol': 'Angol', 'Villarrica': 'Villarrica', 'Pucón': 'Pucón',
          'Padre Las Casas': 'Padre Las Casas', 'Valdivia': 'Valdivia', 'La Unión': 'La Unión', 'Río Bueno': 'Río Bueno',
          'Puerto Montt': 'Puerto Montt', 'Osorno': 'Osorno', 'Castro': 'Castro', 'Ancud': 'Ancud',
          'Puerto Varas': 'Puerto Varas', 'Coyhaique': 'Coyhaique', 'Puerto Aysén': 'Puerto Aysén',
          'Chile Chico': 'Chile Chico', 'Punta Arenas': 'Punta Arenas', 'Puerto Natales': 'Puerto Natales', 'Porvenir': 'Porvenir'
        };

        document.getElementById('RazonSocial').value = data.CardName || '';
        
        // Traducir Industria (Código SAP ➡️ Texto de Formulario)
        const indValue = data.Industry || data.Industria || '';
        document.getElementById('Industria').value = industryMapRev[indValue] || indValue;
        
        // Cargar Dirección
        const calle = data.Address || (data.Direccion ? data.Direccion.Calle : '') || '';
        document.getElementById('CalleNumero').value = calle;
        
        // Traducir Región (Código SAP ➡️ Texto de Formulario)
        const regValue = data.BillToState || (data.Direccion ? data.Direccion.Region : '') || '';
        const regionNombre = regionMapRev[regValue] || regValue;
        document.getElementById('Region').value = regionNombre;
        
        // Traducir Ciudad (Código SAP ➡️ Texto de Formulario)
        const cityRaw = data.City || (data.Direccion ? data.Direccion.Ciudad : '') || '';
        const ciudadNombre = cityMapRev[cityRaw] || cityRaw;

        // Recuperar Comuna
        let comunaSugerida = data.County || (data.Direccion ? data.Direccion.Comuna : '') || '';
        
        const comunasValidas = ChileData[regionNombre] || [];
        const ciudadesValidas = ChileCities[regionNombre] || [];

        // 🚨 REPARADOR AUTOMÁTICO DE DATOS INVERTIDOS DE SAP 🚨
        if (comunaSugerida.includes('Región') || comunasValidas.includes(ciudadNombre)) {
            const comunaReal = comunasValidas.includes(ciudadNombre) ? ciudadNombre : (comunasValidas.includes(comunaSugerida) ? comunaSugerida : '');
            comunaSugerida = comunaReal;
        }

        if (ciudadNombre && ciudadesValidas.includes(ciudadNombre)) {
            document.getElementById('City').value = ciudadNombre;
        }
        if (comunaSugerida && comunasValidas.includes(comunaSugerida)) {
            document.getElementById('Comuna').value = comunaSugerida;
        }

        // Popular cascada de Materialize
        populateComunasYCiudades(regionNombre, comunaSugerida, ciudadNombre);

        // Mapeo Adaptivo Seguro para los Contactos
        let nomAdq = '', rutAdq = '', emailAdq = '', fonoAdq = '';
        let nomPago = '', emailPago = '', fonoPago = '';

        if (data.ContactEmployees && Array.isArray(data.ContactEmployees)) {
            const adqCont = data.ContactEmployees.find(c => c.EmailGroupCode === 'Firmante o RRLL');
            if (adqCont) {
                nomAdq = adqCont.FirstName ? (adqCont.FirstName + ' ' + (adqCont.LastName || '')) : adqCont.Name;
                rutAdq = adqCont.Pager || ''; emailAdq = adqCont.E_Mail || ''; fonoAdq = adqCont.MobilePhone || '';
            }
            const pagoCont = data.ContactEmployees.find(c => c.EmailGroupCode === 'Pago Proveedores');
            if (pagoCont) {
                nomPago = pagoCont.FirstName ? (pagoCont.FirstName + ' ' + (pagoCont.LastName || '')) : pagoCont.Name;
                emailPago = pagoCont.E_Mail || ''; fonoPago = pagoCont.MobilePhone || '';
            }
        } else if (data.Contactos) {
            if (data.Contactos.Adquisiciones) {
                nomAdq = data.Contactos.Adquisiciones.Nombre || ''; rutAdq = data.Contactos.Adquisiciones.Rut || '';
                emailAdq = data.Contactos.Adquisiciones.Email || ''; fonoAdq = data.Contactos.Adquisiciones.Fono || '';
            }
            if (data.Contactos.PagoProveedores) {
                nomPago = data.Contactos.PagoProveedores.Nombre || ''; emailPago = data.Contactos.PagoProveedores.Email || '';
                fonoPago = data.Contactos.PagoProveedores.Fono || '';
            }
        }

        document.getElementById('NombreAdq').value = nomAdq;
        document.getElementById('RutAdq').value = rutAdq;
        document.getElementById('EmailAdq').value = emailAdq;
        document.getElementById('FonoAdq').value = formatPhoneValue(fonoAdq);

        document.getElementById('NombrePago').value = nomPago;
        document.getElementById('EmailPago').value = emailPago;
        document.getElementById('FonoPago').value = formatPhoneValue(fonoPago);

        M.updateTextFields();
        M.FormSelect.init(document.querySelectorAll('select'));
        validarCampos(true); // Carga pasiva: no pinta rojo al abrir la pantalla
      }

      function validarCampos(isInitialLoad = false) {
        let formIsValid = true;
        ALL_CONTACT_FIELDS.forEach(fieldId => {
            const input = document.getElementById(fieldId);
            if (!input) return;
            const value = input.value ? input.value.trim() : '';
            const container = input.tagName === 'SELECT' ? input.closest('.select-wrapper') : input;
            
            if (value === '') {
                container.classList.remove('valid', 'invalid');
                formIsValid = false;
                return; 
            }
            
            let isFormatValid = true;
            if (fieldId === 'RutAdq' && !validaRut(value)) isFormatValid = false;
            if ((fieldId === 'EmailAdq' || fieldId === 'EmailPago') && !isValidEmail(value)) isFormatValid = false;
            if ((fieldId === 'FonoAdq' || fieldId === 'FonoPago') && !isValidPhone(value)) isFormatValid = false;
            
            if (!isFormatValid) {
                formIsValid = false;
                if (!isInitialLoad) { container.classList.remove('valid'); container.classList.add('invalid'); }
            } else {
                if (!isInitialLoad) { container.classList.remove('invalid'); container.classList.add('valid'); }
            }
        });
        return formIsValid;
      }

      document.getElementById('myForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        ALL_CONTACT_FIELDS.forEach(fieldId => {
            const input = document.getElementById(fieldId);
            if(!input) return;
            const value = input.value ? input.value.trim() : '';
            const container = input.tagName === 'SELECT' ? input.closest('.select-wrapper') : input;
            if(value === '') { container.classList.add('invalid'); }
        });

        if (!validarCampos(false)) {
            M.toast({html: '❌ Revise los campos obligatorios o inválidos.', classes: 'red darken-1'});
            return;
        }

        const formData = new FormData(event.target);
        const dataObject = {};
        formData.forEach((value, key) => { dataObject[key] = value.trim(); });
        const storedData = JSON.parse(sessionStorage.getItem('sapClientData'));
        dataObject.CardCode = storedData.CardCode;

        showLoader("Enviando a SAP...");
        try {
            const response = await fetch(WEBHOOK_UPDATE_BP, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataObject)
            });
            const result = await response.json();
            hideLoader();
            if (response.ok && result.success) {
                M.toast({html: '✅ Actualizado exitosamente', classes: 'green darken-1'});
                document.querySelector('.container').innerHTML = `
                    <div class="card-panel center-align" style="margin-top: 50px; padding: 40px;">
                        <h4 class="green-text">¡Éxito!</h4>
                        <p>Datos actualizados correctamente en SAP y ordenados de forma definitiva.</p>
                        <p class="grey-text">Redirigiendo al menú...</p>
                        <div class="progress"><div class="indeterminate"></div></div>
                    </div>
                `;
                setTimeout(() => { window.location.href = "menucliente.html"; }, 4000);
            } else {
                M.toast({html: result.message || '❌ Error.', classes: 'red darken-1'});
            }
        } catch(e) {
            hideLoader();
            M.toast({html: '❌ Error de conexión.', classes: 'red darken-1'});
        }
      });

      function showLoader(msg = "Cargando...") {
        document.getElementById('loaderText').innerText = msg;
        document.getElementById('loader').style.display = 'flex';
      }
      function hideLoader() { document.getElementById('loader').style.display = 'none'; }
      function validaRut(rutCompleto) {
        if (!rutCompleto) return false;
        rutCompleto = rutCompleto.replace(/\./g, "").replace("-", "\u2010");
        if (!/^[0-9]+\u2010[0-9kK]{1}$/.test(rutCompleto)) return false;
        var tmp = rutCompleto.split('\u2010');
        return (dv(tmp[0]) == (tmp[1].toLowerCase() == 'k' ? 'k' : tmp[1]));
      }
      function dv(T) {
        var M = 0, S = 1;
        for (; T; T = Math.floor(T / 10)) { S = (S + T % 10 * (9 - M++ % 6)) % 11; }
        return S ? S - 1 : 'k';
      }
      function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
      function isValidPhone(phone) {
        if (!phone) return false;
        const limpio = phone.trim().replace(/[\s\-()]/g, '');
        return /^\+56(9\d{8}|[2-8]\d{7})$/.test(limpio);
      }
    </script>
  </body>
</html>
