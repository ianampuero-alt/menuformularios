<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud de Retiro o Mantención · ALO Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-1: #0F161E;
      --navy-2: #16232E;
      --navy-3: #22374A;
      --azure:  #3E8ED0;
      --azure-2:#2F7FC4;
      --azure-3:#57A6E8;
      --amber:  #F0851E;
      --char:   #0F1A24;
      --paper:  #F4F7FA;
      --paper-2:#FFFFFF;
      --line:   #DDE5EE;
      --muted:  #6B7A8C;
      --color-primario:   #2F7FC4;
      --color-secundario: #3E8ED0;
      --color-texto:      #0F1A24;
      --color-apoyo:      #F0851E;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--paper);
      font-family: var(--body);
      color: var(--char);
      -webkit-font-smoothing: antialiased;
      padding: 0; margin: 0;
    }
    .topbar {
      position: relative; overflow: hidden;
      padding: 22px 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      color: #EAF2FB;
      background: radial-gradient(120% 160% at 100% 0%, rgba(62,142,208,.30) 0%, rgba(62,142,208,0) 45%), linear-gradient(120deg, var(--navy-3) 0%, var(--navy-2) 45%, var(--navy-1) 100%);
    }
    .topbar::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(118deg, rgba(255,255,255,0) 32%, rgba(120,170,220,.14) 47%, rgba(160,200,240,.05) 53%, rgba(255,255,255,0) 62%);
    }
    .topbar::after {
      content: ""; position: absolute;
      width: 360px; height: 360px; right: -140px; top: -200px;
      background: radial-gradient(circle, rgba(62,142,208,.38) 0%, rgba(62,142,208,0) 70%);
      filter: blur(6px); animation: breathe 7s ease-in-out infinite; pointer-events: none;
    }
    .brand-logo { position: relative; z-index: 1; display: flex; align-items: center; }
    .brand-logo img { height: 36px; width: auto; display: block; }
    .btn-volver {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(234,242,251,.1) !important;
      border: 1px solid rgba(234,242,251,.25) !important;
      color: #EAF2FB !important; cursor: pointer;
      font-family: var(--body); font-size: .88rem; font-weight: 600;
      padding: 9px 16px; border-radius: 10px;
      transition: background .2s, border-color .2s;
    }
    .btn-volver:hover { background: rgba(234,242,251,.18) !important; border-color: rgba(234,242,251,.45) !important; color:#fff !important; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px 64px; }
    .page-head { margin-bottom: 30px; }
    .eyebrow { font-size: .72rem; letter-spacing: 3px; text-transform: uppercase; color: var(--azure-2); font-weight: 600; margin-bottom: 12px; }
    .page-head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.5px; margin: 0; }
    .page-head .lead { color: var(--muted); font-size: 1rem; margin: 12px 0 0; max-width: 560px; line-height: 1.5; }
    .card { border: 1.5px solid var(--line) !important; box-shadow: 0 8px 24px rgba(15,26,36,.06) !important; border-radius: 18px !important; background: var(--paper-2); }
    .form-label.fw-bold { font-size: .8rem; letter-spacing: .3px; color: var(--char); }
    .form-control { border-radius: 12px !important; border: 1.5px solid var(--line) !important; font-family: var(--body); }
    .form-control:focus { border-color: var(--azure) !important; box-shadow: 0 0 0 4px rgba(62,142,208,.15) !important; }
    .input-static { background-color: #EEF3F8 !important; cursor: not-allowed; font-weight: 700; color: var(--navy-2) !important; letter-spacing: .5px; }
    .btn-main { background-color: var(--azure-2) !important; color: #fff !important; font-family: var(--display); font-weight: 700; border: none !important; border-radius: 12px !important; }
    .btn-main:hover { background-color: var(--azure) !important; }
    .text-corp-sec { color: var(--azure-2) !important; }
    .text-corp-apoyo { color: var(--amber) !important; }
    #resultadosArea h5 { font-family: var(--display); font-weight: 700; color: var(--char) !important; letter-spacing: -.3px; }
    #resultadosArea h5 small { color: var(--muted); font-weight: 500; font-family: var(--body); }
    .tabla-contratos { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
    .fila-contrato { background: var(--paper-2); cursor: pointer; transition: transform .18s ease, box-shadow .2s ease; box-shadow: 0 2px 8px rgba(15,26,36,.05); }
    .fila-contrato:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,26,36,.10); }
    .fila-contrato td { padding: 18px 18px; vertical-align: middle; border-top: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); background: var(--paper-2); }
    .fila-contrato td:first-child { border-left: 1.5px solid var(--line); border-radius: 14px 0 0 14px; border-right: none; }
    .fila-contrato td:last-child  { border-right: 1.5px solid var(--line); border-radius: 0 14px 14px 0; }
    .fila-contrato:hover td:first-child { border-left: 4px solid var(--azure); }
    .doc-num { display: inline-block; font-family: var(--display); font-weight: 700; color: var(--azure-2); background: rgba(62,142,208,.10); padding: 4px 12px; border-radius: 999px; font-size: .92rem; }
    .fila-detalle > td { background: transparent !important; border: none !important; padding: 0 !important; }
    .contenedor-equipos { padding: 22px 24px; border-left: 4px solid var(--azure); margin: 0 0 4px; background: #F8FAFC; border-radius: 0 14px 14px 0; border: 1.5px solid var(--line); }
    .contenedor-equipos h6 { font-family: var(--display); font-weight: 700; color: var(--char) !important; }
    .equipos-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
    .btn-selall { font-size: .8rem; font-weight: 600; border-radius: 10px !important; padding: 6px 12px; color: var(--azure-2); border: 1.5px solid var(--azure-2); background: transparent; }
    .btn-selall:hover { background: var(--azure-2); color: #fff; }
    .item-equipo-wrapper { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 16px 0; }
    .item-equipo-wrapper:last-child { border-bottom: none; }
    .form-check-input.equipo-chk { width: 1.5rem; height: 1.5rem; border: 2px solid var(--azure-2); cursor: pointer; margin-top: 0; flex-shrink: 0; }
    .form-check-input.equipo-chk:checked { background-color: var(--azure-2); border-color: var(--azure-2); }
    .item-equipo { flex: 1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .info-equipo { flex: 1; min-width: 240px; }
    .info-equipo .fs-5 { font-family: var(--display); font-weight: 700; color: var(--char) !important; }
    .acciones-equipo { display: flex; gap: 8px; }
    .btn-accion { font-size: .85rem; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; border-radius: 10px !important; padding: 8px 14px; }
    .btn-retiro { color: var(--azure-2); border: 1.5px solid var(--azure-2); background: transparent; }
    .btn-retiro:hover { background: var(--azure-2); color: #fff; }
    .btn-servicio { color: #B4610F; border: 1.5px solid var(--amber); background: transparent; }
    .btn-servicio:hover { background: var(--amber); color: #fff; }
    .btn-accion:disabled, .btn-accion.disabled { color: var(--muted) !important; border-color: var(--line) !important; background: #EEF1F5 !important; cursor: not-allowed !important; opacity: 1 !important; }
    .btn-accion:disabled:hover, .btn-accion.disabled:hover { background: #EEF1F5 !important; color: var(--muted) !important; }
    .contenedor-retiro-multiple { background: #EAF2FB; padding: 16px; border-radius: 12px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .contenedor-retiro-multiple .contador { font-weight: 600; color: var(--navy-2); }
    .contenedor-retiro-multiple .contador b { color: var(--azure-2); }
    .acciones-multiples { display: flex; gap: 8px; flex-wrap: wrap; }
    .success-final { text-align: center; padding: 56px 28px; background: var(--paper-2); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: 0 12px 30px rgba(15,26,36,.06); margin-top: 24px; }
    .success-final .ring { width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%; background: rgba(46,125,70,.12); display: grid; place-items: center; }
    .success-final .ring svg { width: 44px; height: 44px; }
    .success-final h2 { font-family: var(--display); font-weight: 700; color: #2E7D46; }
    .success-final .big { font-size: 1.1rem; margin-top: 6px; }
    .success-final .muted { color: var(--muted); margin-top: 4px; }
    .hidden { display: none !important; }
    .swal2-popup { font-family: var(--body) !important; border-radius: 18px !important; }
    .swal2-title { font-family: var(--display) !important; color: var(--char) !important; }
    .swal2-styled.swal2-confirm { border-radius: 12px !important; font-family: var(--display) !important; font-weight: 700 !important; }
    .swal2-styled.swal2-cancel  { border-radius: 12px !important; font-weight: 600 !important; }
    .swal-lista-equipos { text-align:left; background:#F8FAFC; border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; max-height:140px; overflow:auto; font-size:.9rem; margin-bottom:14px; }
    .swal-lista-equipos div { padding:3px 0; }
    @media (max-width: 620px) {
      .topbar { padding: 16px 18px; }
      .brand-logo img { height: 28px; }
      .wrap { padding: 30px 18px 52px; }
      .acciones-equipo { width: 100%; }
      .btn-accion { flex: 1; justify-content: center; }
      .contenedor-retiro-multiple { flex-direction: column; text-align: center; }
      .acciones-multiples { width: 100%; }
      .acciones-multiples .btn { flex: 1; }
    }
  </style>
</head>

<div class="wrap">
  <div id="main-container">
    <div class="page-head">
      <div class="eyebrow">Portal de servicios</div>
      <h1>Retiro o mantención</h1>
      <p class="lead">Estos son los contratos vigentes de tu empresa. Abre un contrato, marca uno o varios equipos y solicita un retiro o un servicio.</p>
    </div>
    <div class="card p-4 mb-4">
      <label class="form-label fw-bold mb-2">RUT del cliente</label>
      <div class="input-group">
        <input type="text" id="rutInput" class="form-control input-static" readonly>
        <button class="btn btn-main hidden" onclick="buscar()" id="btnBuscar">Buscar contratos</button>
      </div>
      <div class="form-text text-muted mt-2">Cargando los contratos asociados a este RUT…</div>
      <div id="loading" class="text-center mt-3 hidden">
        <div class="spinner-border text-corp-sec" role="status"></div>
        <div class="mt-2 text-muted">Buscando contratos en SAP…</div>
      </div>
    </div>
    <div id="resultadosArea" class="hidden">
      <h5 class="mb-3">Contratos vigentes <small>· toca uno para ver sus equipos</small></h5>
      <table class="tabla-contratos">
        <tbody id="tablaBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const URL_GET_CONTRATOS = "https://alogroup.app.n8n.cloud/webhook/get-contratos";
  const URL_ENVIAR_SOLICITUD = "https://alogroup.app.n8n.cloud/webhook/solicitudes-sap";
  let contratosData = [];
  let emailUsuarioGlobal = "prueba@alo.cl"; 
  let equiposPorContrato = {};

  window.onload = function() {
    const storedRut = sessionStorage.getItem('sapRut');
    const storedData = sessionStorage.getItem('sapClientData');
    if (storedData) {
      const clientData = JSON.parse(storedData);
      emailUsuarioGlobal = clientData.Contactos?.Adquisiciones?.Email || "prueba@alo.cl";
    }
    if (storedRut) {
      let rutLimpio = storedRut.replace(/[^0-9Kk]/g, '');
      if (rutLimpio.toUpperCase().startsWith('C')) rutLimpio = rutLimpio.substring(1);
      const inputRut = document.getElementById('rutInput');
      inputRut.value = rutLimpio;
      var raw = rutLimpio;
      if(raw.length > 1) {
          inputRut.value = raw.slice(0, -1) + "-" + raw.slice(-1);
      }
      buscar();
    } else {
        Swal.fire('Sesión caducada', 'No se encontró un RUT activo. Volviendo al inicio…', 'warning')
        .then(() => {
            window.location.href = "index.html";
        });
    }
  };

  async function buscar() {
    var rutVisual = document.getElementById('rutInput').value.replace(/[^0-9Kk]/g, '');
    if(rutVisual.length < 3) return;
    var rutParaSap = "C" + rutVisual.toUpperCase();
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('resultadosArea').classList.add('hidden');
    document.getElementById('btnBuscar').disabled = true;
    try {
        const response = await fetch(URL_GET_CONTRATOS, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rut: rutParaSap })
        });
        const data = await response.json();
        document.getElementById('loading').classList.add('hidden');
        if(data.success === false) {
             Swal.fire('Atención', data.message || 'No se encontraron contratos', 'info');
             return;
        }
        renderizarTabla(data.contratos || []);
    } catch(err) {
        document.getElementById('loading').classList.add('hidden');
        Swal.fire('Error', 'Fallo de conexión con el servidor n8n.', 'error');
    }
  }

  function renderizarTabla(contratosArray) {
    if (!contratosArray || contratosArray.length === 0) {
      Swal.fire({ title: 'Sin resultados', text: 'No se encontraron contratos activos.', icon: 'info' });
      return;
    }
    contratosData = contratosArray;
    equiposPorContrato = {};
    var tbody = document.getElementById('tablaBody');
    tbody.innerHTML = "";
    contratosData.forEach((contrato, index) => {
      var nombreObra = contrato.U_Dest || "";
      var calleObra = contrato.U_DestAddr || "";
      var direccionCompleta = (nombreObra + " - " + calleObra).trim();
      if (direccionCompleta === "-" || !direccionCompleta) direccionCompleta = "Sin ubicación especificada";
      var filaContrato = `
        <tr class="fila-contrato" onclick="toggleDetalle(${index})">
          <td style="width: 1%;"><span class="doc-num">#${contrato.DocNum}</span></td>
          <td>
            <div class="fw-bold text-dark">${direccionCompleta}</div>
            <small class="text-muted">Estado: ${contrato.U_Estado || 'Activo'}</small>
          </td>
          <td class="text-end text-corp-sec"><i class="bi bi-chevron-down" id="icono-${index}"></i></td>
        </tr>
      `;
      var htmlEquipos = generarHtmlEquipos(contrato.VID_RTOVDCollection || [], contrato, direccionCompleta, index);
      var filaDetalle = `
        <tr id="detalle-${index}" class="fila-detalle hidden">
          <td colspan="3">
            <div class="contenedor-equipos">
              <div class="equipos-head">
                <h6 class="mb-0">Equipos en este contrato</h6>
                <button class="btn btn-selall" onclick="toggleSeleccionarTodos(${index})" id="btnSelAll-${index}">
                  <i class="bi bi-check2-square"></i> Seleccionar todos
                </button>
              </div>
              ${htmlEquipos}
              <div class="contenedor-retiro-multiple">
                <div class="contador">
                  <span id="contador-${index}">0</span> equipo(s) seleccionado(s)
                </div>
                <div class="acciones-multiples">
                  <button class="btn btn-sm btn-retiro btn-accion" onclick="solicitarSeleccionados('Retiro', ${index})">
                    <i class="bi bi-truck"></i> Retiro seleccionados
                  </button>
                  <button class="btn btn-sm btn-servicio btn-accion" id="btnServMulti-${index}" onclick="solicitarSeleccionados('Mantenimiento', ${index})">
                    <i class="bi bi-wrench"></i> Servicio seleccionados
                  </button>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
      tbody.innerHTML += filaContrato + filaDetalle;
    });
    document.getElementById('resultadosArea').classList.remove('hidden');
  }

  function generarHtmlEquipos(equipos, contratoInfo, direccionCompleta, indexContrato) {
    equiposPorContrato[indexContrato] = [];
    if (!equipos || equipos.length === 0) return "<p class='text-muted mb-0'>Sin equipos listados.</p>";
    var html = "";
    equipos.forEach((eq, i) => {
      var codigo = eq.U_ItemCode || "";
      var nombre = eq.U_ItemName || "Equipo";
      var numInterno = eq.U_Dim4 || "";
      var identificador = numInterno ? numInterno : codigo;
      var subF = numInterno.includes("-") ? numInterno.split("-")[0] : "";
      var datosEquipo = {
        contrato: contratoInfo.DocNum,
        docEntry: contratoInfo.DocEntry,
        cardName: contratoInfo.U_CardName || "",
        vendedor: Number(contratoInfo.U_Vendedor || 1),
        equipoCode: codigo,
        equipoNombre: nombre,
        numInterno: numInterno,
        identificador: identificador,
        direccion: direccionCompleta,
        serie: eq.U_NumSerie || eq.U_NroSerie || "",
        familia: eq.U_Familia || "",
        sFamilia: eq.U_sFamilia || subF
      };
      equiposPorContrato[indexContrato].push(datosEquipo);
      html += `
        <div class="item-equipo-wrapper">
          <input class="form-check-input equipo-chk" type="checkbox"
                 id="chk-${indexContrato}-${i}"
                 data-contrato="${indexContrato}" data-equipo="${i}"
                 onchange="actualizarContador(${indexContrato})">
          <div class="item-equipo">
            <div class="info-equipo">
              <span class="fs-5">${identificador}</span><br>
              <small class="text-muted">${nombre}</small>
            </div>
          </div>
        </div>
      `;
    });
    return html;
  }

  function actualizarContador(indexContrato) {
    var checks = document.querySelectorAll(`.equipo-chk[data-contrato="${indexContrato}"]`);
    var marcados = document.querySelectorAll(`.equipo-chk[data-contrato="${indexContrato}"]:checked`);
    var cont = document.getElementById(`contador-${indexContrato}`);
    if (cont) cont.textContent = marcados.length;
    var btn = document.getElementById(`btnSelAll-${indexContrato}`);
    if (btn) {
      if (marcados.length === checks.length && checks.length > 0) {
        btn.innerHTML = '<i class="bi bi-x-square"></i> Quitar selección';
      } else {
        btn.innerHTML = '<i class="bi bi-check2-square"></i> Seleccionar todos';
      }
    }
    var btnServ = document.getElementById(`btnServMulti-${indexContrato}`);
    if (btnServ) {
      if (marcados.length > 1) {
        btnServ.disabled = true;
        btnServ.title = 'El servicio/mantención solo puede solicitarse de a un equipo';
      } else {
        btnServ.disabled = false;
        btnServ.title = '';
      }
    }
  }

  function toggleSeleccionarTodos(indexContrato) {
    var checks = document.querySelectorAll(`.equipo-chk[data-contrato="${indexContrato}"]`);
    var marcados = document.querySelectorAll(`.equipo-chk[data-contrato="${indexContrato}"]:checked`);
    var seleccionarTodos = !(marcados.length === checks.length && checks.length > 0);
    checks.forEach(c => c.checked = seleccionarTodos);
    actualizarContador(indexContrato);
  }

  function toggleDetalle(index) {
    var filaActual = document.getElementById(`detalle-${index}`);
    var iconoActual = document.getElementById(`icono-${index}`);
    var estabaCerrada = filaActual.classList.contains('hidden');
    document.querySelectorAll('.fila-detalle').forEach(fila => fila.classList.add('hidden'));
    document.querySelectorAll('.bi-chevron-up').forEach(icono => {
      icono.classList.replace('bi-chevron-up', 'bi-chevron-down');
    });
    if (estabaCerrada) {
      filaActual.classList.remove('hidden');
      iconoActual.classList.replace('bi-chevron-down', 'bi-chevron-up');
    }
  }

  function solicitarSeleccionados(tipo, indexContrato) {
    var marcados = document.querySelectorAll(`.equipo-chk[data-contrato="${indexContrato}"]:checked`);
    if (marcados.length === 0) {
      Swal.fire('Sin selección', 'Marca al menos un equipo con el checkbox.', 'info');
      return;
    }
    if (tipo === 'Mantenimiento' && marcados.length > 1) {
      Swal.fire('Solo un equipo', 'El servicio/mantención solo puede solicitarse de a un equipo. Marca solo uno.', 'info');
      return;
    }
    var lista = [];
    marcados.forEach(chk => {
      var i = parseInt(chk.getAttribute('data-equipo'), 10);
      lista.push(equiposPorContrato[indexContrato][i]);
    });
    abrirFormulario(tipo, lista);
  }

  function abrirFormulario(tipo, listaEquipos) {
    var titulo = tipo === 'Retiro' ? "🚚 Solicitud de retiro" : "🔧 Solicitud de servicio";
    var htmlLista = listaEquipos.map(e =>
      `<div><i class="bi bi-box-seam text-corp-sec"></i> <b>${e.identificador || e.numInterno || e.equipoCode}</b> — <span class="text-muted">${e.equipoNombre}</span></div>`
    ).join("");
    Swal.fire({
      title: titulo,
      html: `
        <div class="text-start">
          <p class="text-center text-muted mb-2">${listaEquipos.length} equipo(s) en esta solicitud</p>
          <div class="swal-lista-equipos">${htmlLista}</div>
          <label class="form-label fw-bold">Nombre de contacto *</label>
          <input id="swal-nombre" class="form-control mb-3" placeholder="Ej: Juan Pérez" type="text">
          <label class="form-label fw-bold">Teléfono de contacto *</label>
          <input id="swal-telefono" class="form-control mb-3" placeholder="Ej: +56912345678" type="tel">
          <label class="form-label fw-bold">Detalle / motivo</label>
          <textarea id="swal-comentario" class="form-control" style="height: 100px;" placeholder="Indica el motivo o la falla…"></textarea>
        </div>
      `,
      showCancelButton: true,
      confirmButtonColor: '#2F7FC4',
      cancelButtonColor: '#6B7A8C',
      confirmButtonText: 'Enviar solicitud',
      cancelButtonText: 'Cancelar',
      focusConfirm: false,
      preConfirm: () => {
        const nombre = document.getElementById('swal-nombre').value.trim();
        const telefono = document.getElementById('swal-telefono').value.trim();
        const comentario = document.getElementById('swal-comentario').value.trim();
        if (!nombre) { Swal.showValidationMessage('El nombre es obligatorio'); return false; }
        if (!telefono) { Swal.showValidationMessage('El teléfono es obligatorio'); return false; }
        if (!comentario) { Swal.showValidationMessage('Por favor, ingresa un motivo'); return false; }

        Swal.getConfirmButton().disabled = true;
        return { nombre: nombre, telefono: telefono, comentario: comentario };
      }
    }).then((result) => {
      if (result.isConfirmed) {
        var rutFinal = "C" + document.getElementById('rutInput').value.replace(/[^0-9Kk]/g, "");
        const base = listaEquipos[0];

        // --- SALVAVIDAS N8N ---
        let payload = {
          rut: rutFinal,
          email: emailUsuarioGlobal,
          contrato: base.contrato,
          docEntry: base.docEntry,
          cardName: base.cardName,
          vendedor: base.vendedor,
          direccion: base.direccion,
          tipoSolicitud: tipo,
          nombreContacto: result.value.nombre,
          telefono: result.value.telefono,
          comentarios: result.value.comentario,
          equipoCode: base.equipoCode,
          numInterno: base.numInterno
        };

        if (tipo === 'Retiro') {
          payload.equipos = listaEquipos;
        } else {
          payload.equipoNombre = base.equipoNombre;
          payload.serie = base.serie;
          payload.familia = base.familia;
          payload.sFamilia = base.sFamilia;
        }

        enviarAlServidor(payload);
      }
    });
  }

  async function enviarAlServidor(payload) {
    Swal.fire({ title: 'Enviando a SAP…', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
    try {
        const response = await fetch(URL_ENVIAR_SOLICITUD, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
            Swal.close();
            sessionStorage.clear();
            document.getElementById('main-container').innerHTML = `
                <div class="success-final">
                    <div class="ring">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#2E7D46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                    </div>
                    <h2>¡Gracias!</h2>
                    <p class="big">Tu solicitud quedó ingresada en nuestros sistemas.</p>
                    <p class="muted">Te estamos llevando de vuelta al inicio…</p>
                    <div class="spinner-border text-corp-sec mx-auto mt-4" style="width: 2.5rem; height: 2.5rem;" role="status"></div>
                </div>
            `;
            setTimeout(() => { window.location.href = "index.html"; }, 4000);
        } else {
             Swal.fire('Atención', data.message || 'Error al procesar en SAP.', 'error');
        }
    } catch(err) {
        Swal.fire('Error', 'Fallo de conexión al enviar la solicitud a n8n.', 'error');
    }
  }
</script>
</body>
