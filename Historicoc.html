<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Servicios · ALO Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        /* Paleta Oficial ALO Group */
        --navy-1: #0F161E;
        --navy-2: #16232E;
        --navy-3: #22374A;
        --azure:   #3E8ED0;
        --azure-2: #2F7FC4;
        --azure-3: #57A6E8;
        --amber:   #F0851E;

        --char:    #0F1A24;
        --paper:   #F4F7FA;
        --paper-2: #FFFFFF;
        --line:    #DDE5EE;
        --muted:   #6B7A8C;
        --err:     #C0341D;

        --display: 'Bricolage Grotesque', system-ui, sans-serif;
        --body: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
        font-family: var(--body);
        color: var(--char);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; min-height: 100vh;
    }

    /* ---------- TOP BRAND BAR ---------- */
    .topbar {
        position: relative; overflow: hidden;
        padding: 22px 32px;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        color: #EAF2FB;
        background:
            radial-gradient(120% 160% at 100% 0%, rgba(62,142,208,.30) 0%, rgba(62,142,208,0) 45%),
            linear-gradient(120deg, var(--navy-3) 0%, var(--navy-2) 45%, var(--navy-1) 100%);
        box-shadow: 0 4px 20px rgba(15,22,30,.25);
    }
    .topbar::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(118deg, rgba(255,255,255,0) 32%, rgba(120,170,220,.14) 47%, rgba(160,200,240,.05) 53%, rgba(255,255,255,0) 62%);
    }
    .topbar::after {
        content: ""; position: absolute;
        width: 360px; height: 360px; right: -140px; top: -200px;
        background: radial-gradient(circle, rgba(62,142,208,.38) 0%, rgba(62,142,208,0) 70%);
        filter: blur(6px); animation: breathe 7s ease-in-out infinite; pointer-events: none;
    }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity:.7; } 50% { transform: scale(1.12); opacity:1; } }

    .brand-logo { position: relative; z-index: 1; display: flex; align-items: center; }
    .brand-logo img { height: 44px; width: auto; display: block; }

    .logout {
        position: relative; z-index: 1;
        display: inline-flex; align-items: center; gap: 8px;
        background: rgba(234,242,251,.1);
        border: 1px solid rgba(234,242,251,.25);
        color: #EAF2FB; cursor: pointer;
        font-family: var(--body); font-size: .88rem; font-weight: 600;
        padding: 9px 16px; border-radius: 10px;
        transition: background .2s, border-color .2s;
    }
    .logout:hover { background: rgba(234,242,251,.18); border-color: rgba(234,242,251,.45); }
    .logout svg { width: 16px; height: 16px; }

    /* ---------- CONTENT ---------- */
    .wrap { flex: 1; display: flex; justify-content: center; padding: 48px 24px 64px; }
    .content { width: 100%; max-width: 860px; }

    .greeting { margin-bottom: 6px; }
    .eyebrow { font-size: .72rem; letter-spacing: 3px; text-transform: uppercase; color: var(--azure-2); font-weight: 600; margin-bottom: 12px; }
    .greeting h1 {
        font-family: var(--display); font-weight: 700;
        font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.5px; line-height: 1.05;
    }
    .greeting h1 .name { color: var(--navy-2); }
    .lead { color: var(--muted); font-size: 1.02rem; margin: 14px 0 36px; max-width: 580px; line-height: 1.5; }

    .section-label {
        font-size: .78rem; letter-spacing: 1.5px; text-transform: uppercase;
        color: var(--muted); font-weight: 600; margin-bottom: 18px;
    }

    .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }

    .service {
        position: relative; text-align: left; cursor: pointer;
        background: var(--paper-2);
        border: 1.5px solid var(--line);
        border-radius: 18px;
        padding: 26px 24px 24px;
        display: flex; flex-direction: column; gap: 14px;
        font-family: var(--body);
        transition: transform .16s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .service:hover {
        transform: translateY(-3px);
        border-color: var(--azure);
        box-shadow: 0 14px 32px rgba(15,26,36,.10);
    }
    .service .icon {
        width: 52px; height: 52px; border-radius: 14px;
        display: grid; place-items: center;
        background: linear-gradient(150deg, var(--azure-3), var(--azure-2));
        box-shadow: 0 6px 16px rgba(47,127,196,.32);
    }
    .service .icon svg { width: 26px; height: 26px; stroke: #fff; }
    .service .icon.amber { background: linear-gradient(150deg, #F6A64D, var(--amber)); box-shadow: 0 6px 16px rgba(240,133,30,.32); }
    .service .icon.navy { background: linear-gradient(150deg, var(--navy-3), var(--navy-1)); box-shadow: 0 6px 16px rgba(15,22,30,.32); }

    .service h3 { font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: -.3px; }
    .service p { color: var(--muted); font-size: .92rem; line-height: 1.45; }
    .service .go {
        margin-top: auto; padding-top: 8px;
        display: inline-flex; align-items: center; gap: 7px;
        color: var(--azure-2); font-weight: 600; font-size: .9rem;
        transition: gap .2s ease;
    }
    .service:hover .go { gap: 12px; }
    .service .go svg { width: 16px; height: 16px; }

    .footnote { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
    .footnote a { color: var(--azure-2); font-weight: 600; text-decoration: none; }
    .footnote a:hover { text-decoration: underline; }

    .fade-in { animation: fade .5s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @media (max-width: 620px) {
        .topbar { padding: 18px 20px; }
        .brand-logo img { height: 34px; }
        .wrap { padding: 34px 20px 52px; }
        .services { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const storedData = sessionStorage.getItem('sapClientData');
        const storedRut = sessionStorage.getItem('sapRut');

        if (!storedRut) {
            window.location.href = 'index.html';
            return;
        }

        if (storedData) {
            try {
                const parsed = JSON.parse(storedData);
                const clientData = parsed.data ? parsed.data : parsed;
                document.getElementById('welcomeName').textContent = clientData.CardName || clientData.RazonSocial || 'Cliente';
            } catch(e) {
                console.error("Error al parsear sapClientData", e);
            }
        }
    });

    function irAServicio(urlDestino) {
        const urlParams = new URLSearchParams(window.location.search);
        const activeRut = urlParams.get('rut') || sessionStorage.getItem('sapRut');

        let targetUrl = urlDestino;
        if (activeRut) {
            const separator = targetUrl.includes('?') ? '&' : '?';
            targetUrl += `${separator}rut=${encodeURIComponent(activeRut)}`;
        }
        window.location.href = targetUrl;
    }

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
</script>
