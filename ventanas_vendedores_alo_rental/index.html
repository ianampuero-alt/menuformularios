<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ALO Vendedores</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="logo-area">
            <h1>ALO <span class="highlight">RENTAL</span></h1>
            <p>Portal Comercial</p>
        </div>
        <div id="alertMsg" class="alert" style="display:none;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Correo Corporativo</label>
                <input type="email" id="email" placeholder="usuario@alo-group.com" required>
            </div>
            <div class="form-group" id="otpGroup" style="display: none;">
                <label>Código OTP</label>
                <input type="text" id="otp" placeholder="Ingrese el código recibido">
            </div>
            <button type="button" class="btn btn-primary full-width" id="btnRequestOtp">Solicitar Acceso</button>
            <button type="submit" class="btn btn-primary full-width" id="btnLogin" style="display: none;">Ingresar</button>
        </form>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
