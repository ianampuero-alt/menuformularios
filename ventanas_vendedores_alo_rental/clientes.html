<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - ALO Vendedores</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">ALO <span class="highlight">RENTAL</span></div>
        <div class="nav-menu">
            <a href="dashboard.html">Inicio</a>
            <a href="clientes.html" class="active">Clientes</a>
            <a href="cotizacion.html">Cotizaciones</a>
            <a href="#" onclick="app.logout()" class="logout">Cerrar Sesión</a>
        </div>
    </nav>
    <main class="container">
        <div class="panel">
            <h2>Buscador de Clientes</h2>
            <div class="search-bar">
                <input type="text" id="searchRut" placeholder="Ej: 76721028-0">
                <input type="text" id="searchName" placeholder="Nombre Comercial...">
                <button class="btn btn-primary" onclick="app.buscarClientes()">Buscar</button>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>RUT</th>
                            <th>Nombre Comercial</th>
                            <th>Condición Pago</th>
                            <th>Estado Tributario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientesBody">
                        <tr><td colspan="5" class="text-center">Ingrese criterios de búsqueda</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>app.checkSession();</script>
</body>
</html>
