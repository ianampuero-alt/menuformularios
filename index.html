<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Portal - ALO RENTAL</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Carga SDK Oficial Google SSO -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="logo-area">
            <h1>ALO <span class="highlight">RENTAL</span></h1>
            <p>Portal de Servicios</p>
        </div>

        <!-- Pestañas de Selección de Rol -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="app.switchTab('trabajador')">Colaboradores ALO</button>
            <button class="tab-btn" onclick="app.switchTab('cliente')">Portal Clientes</button>
        </div>

        <div id="alertMsg" class="alert" style="display:none;"></div>

        <!-- VISTA 1: COLABORADORES (Google SSO) -->
        <div id="viewTrabajador" class="tab-content active">
            <p class="tab-desc">Ingresa con tu correo corporativo @alo-group.com</p>
            <div id="g_id_onload"
                 data-client_id="TU_CLIENT_ID_GOOGLE.apps.googleusercontent.com"
                 data-callback="handleGoogleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="outline" data-size="large" data-width="100%"></div>
        </div>

        <!-- VISTA 2: CLIENTES (RUT + OTP tradicional) -->
        <div id="viewCliente" class="tab-content" style="display:none;">
            <form id="formLoginCliente">
                <div class="form-group">
                    <label>RUT Cliente</label>
                    <input type="text" id="clientRut" placeholder="Ej: 76721028-0" required>
                </div>
                <div class="form-group">
                    <label>Correo de Contacto</label>
                    <input type="email" id="clientEmail" placeholder="contacto@empresa.cl" required>
                </div>
                <div class="form-group" id="otpGroup" style="display: none;">
                    <label>Código OTP</label>
                    <input type="text" id="clientOtp" placeholder="Ingrese el código enviado">
                </div>
                <button type="button" class="btn btn-primary full-width" id="btnRequestOtp" onclick="app.requestClientOtp()">Solicitar Acceso</button>
                <button type="submit" class="btn btn-primary full-width" id="btnLoginCliente" style="display: none;">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
